<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мини-игры P2P (Без серверов)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 20px; }
  h1 { text-align: center; margin: 10px 0; font-size: 24px; }
  .container { max-width: 1000px; margin: 0 auto; }
  #menu { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
  #menu button { padding: 10px 16px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer;
    background: #4a4a6a; color: white; transition: 0.2s; }
  #menu button:hover { background: #5a5a7a; }
  #menu button.active { background: #e94560; }
  #status { text-align: center; font-size: 18px; font-weight: bold; min-height: 26px; margin: 10px 0; }
  #game-area { display: flex; justify-content: center; margin: 15px 0; min-height: 100px; }
  .cell { display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; }
  
  .ttt-board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 6px; }
  .ttt-board .cell { background: #16213e; font-size: 48px; font-weight: bold; border-radius: 8px; }
  .ttt-board .cell.x { color: #4fc3f7; }
  .ttt-board .cell.o { color: #e94560; }

  .chess-board, .checkers-board { display: grid; grid-template-columns: repeat(8, 48px); grid-template-rows: repeat(8, 48px); border: 3px solid #333; }
  .chess-board .cell, .checkers-board .cell { font-size: 32px; line-height: 1; }
  .chess-board .light, .checkers-board .light { background: #f0d9b5; }
  .chess-board .dark, .checkers-board .dark { background: #b58863; }
  .cell.selected { outline: 3px solid #ffd700; outline-offset: -3px; }

  .c4-board { display: grid; grid-template-columns: repeat(7, 50px); grid-template-rows: repeat(6, 50px);
    gap: 4px; background: #0033cc; padding: 8px; border-radius: 10px; }
  .c4-board .cell { background: #16213e; border-radius: 50%; }
  .c4-board .cell.red { background: #e94560; }
  .c4-board .cell.yellow { background: #ffd700; }

  .bs-boards { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
  .bs-board { display: grid; gap: 2px; }
  .bs-board .cell { background: #4a90e2; border-radius: 3px; font-size: 16px; }
  .bs-board .cell.ship { background: #555; }
  .bs-board .cell.hit { background: #e94560; }
  .bs-board .cell.miss { background: #888; }
  .bs-title { text-align: center; margin: 5px 0; font-size: 14px; font-weight: bold; }

  #settings { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin: 15px 0;
    padding: 12px; background: #16213e; border-radius: 8px; }
  #settings label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  #settings select { padding: 6px 10px; border-radius: 6px; border: none; background: #4a4a6a; color: white; font-size: 14px; }
  
  #controls { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 20px 0; }
  #controls button { padding: 12px 24px; border: none; border-radius: 6px; background: #e94560; color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
  #controls button:disabled { background: #555; cursor: not-allowed; }
  
  .p2p-box { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; background: #16213e; padding: 15px; border-radius: 8px; margin-top: 10px; }
  .p2p-box textarea { width: 100%; height: 80px; font-family: monospace; font-size: 12px; padding: 8px; border-radius: 6px; border: 1px solid #4a4a6a; background: #0f172a; color: #fff; resize: none; }
  .p2p-box input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4a4a6a; background: #0f172a; color: #fff; font-family: monospace; font-size: 12px; }
  .p2p-box button { padding: 10px; border: none; border-radius: 6px; background: #4a4a6a; color: white; cursor: pointer; font-weight: bold; }
  .p2p-box button:hover { background: #5a5a7a; }
  .hidden { display: none !important; }
  
  .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
  .tabs button { flex: 1; background: #333; }
  .tabs button.active { background: #e94560; }
</style>
</head>
<body>
<div class="container">
  <h1>🎮 Мини-игры P2P</h1>
  <div id="menu">
    <button data-game="tictactoe">Крестики-нолики</button>
    <button data-game="chess">Шахматы</button>
    <button data-game="checkers">Русские шашки</button>
    <button data-game="connect4">4 в ряд</button>
    <button data-game="battleship">Морской бой</button>
  </div>
  
  <div id="settings">
    <label>Режим:
      <select id="mode">
        <option value="bot">🤖 С ботом</option>
        <option value="local">👥 Локально (2 игрока)</option>
        <option value="p2p">🌐 Онлайн P2P (Без серверов)</option>
      </select>
    </label>
    <label id="levelRow">Сложность бота:
      <select id="level">
        <option value="easy">Лёгкий</option>
        <option value="medium">Средний</option>
        <option value="hard">Сложный</option>
      </select>
    </label>
    <label id="sizeRow">Размер поля (Морской бой):
      <select id="bsSize">
        <option value="8">8×8 (быстрый)</option>
        <option value="10">10×10 (классика)</option>
      </select>
    </label>
  </div>

  <div id="status">Выберите игру и настройки</div>
  <div id="game-area"></div>
  
  <div id="controls">
    <button id="startBtn">▶ Начать игру</button>
    
    <!-- Блок ручного P2P -->
    <div id="p2pUI" class="hidden p2p-box">
      <div class="tabs">
        <button id="tabHost" class="active">Я создаю игру</button>
        <button id="tabGuest">Я подключаюсь</button>
      </div>

      <!-- Хост -->
      <div id="hostUI">
        <p style="font-size:13px; color:#aaa; margin:0 0 10px 0;">1. Нажмите кнопку, скопируйте код и отправьте другу.</p>
        <button id="genCodeBtn" style="background:#e94560; margin-bottom:10px;">Создать код приглашения</button>
        <textarea id="hostCodeOut" readonly placeholder="Здесь появится ваш код..."></textarea>
        <p style="font-size:13px; color:#aaa; margin:10px 0;">2. Вставьте ответный код от друга:</p>
        <input type="text" id="guestCodeIn" placeholder="Ответный код друга">
        <button id="finishConnBtn" style="margin-top:10px;">Завершить подключение</button>
      </div>

      <!-- Гость -->
      <div id="guestUI" class="hidden">
        <p style="font-size:13px; color:#aaa; margin:0 0 10px 0;">1. Вставьте код приглашения от друга:</p>
        <input type="text" id="hostCodeIn" placeholder="Код приглашения">
        <button id="joinGameBtn" style="margin-top:10px; background:#e94560;">Сгенерировать ответ</button>
        <p style="font-size:13px; color:#aaa; margin:10px 0;">2. Скопируйте ответный код и отправьте другу:</p>
        <textarea id="guestCodeOut" readonly placeholder="Здесь появится ответный код..."></textarea>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
// ========== РУЧНОЙ WEBRTC (БЕЗ СЕРВЕРОВ) ==========
class ManualP2P {
  constructor() {
    this.pc = null;
    this.channel = null;
    this.onData = null;
    this.onOpen = null;
  }

  async createOffer() {
    this.pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    this.channel = this.pc.createDataChannel('game');
    this.setupChannel();
    
    const candidates = [];
    this.pc.onicecandidate = e => { if (e.candidate) candidates.push(e.candidate); };
    
    await this.pc.setLocalDescription(await this.pc.createOffer());
    
    return new Promise(resolve => {
      const check = () => {
        if (this.pc.iceGatheringState === 'complete') {
          resolve(btoa(unescape(encodeURIComponent(JSON.stringify({
            sdp: this.pc.localDescription.sdp,
            candidates: candidates
          })))));
        }
      };
      this.pc.onicegatheringstatechange = check;
      setTimeout(check, 2000); // Ждем максимум 2 сек
    });
  }

  async acceptOffer(code) {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    this.pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    this.pc.ondatachannel = e => { this.channel = e.channel; this.setupChannel(); };
    
    await this.pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
    for (const c of data.candidates) await this.pc.addIceCandidate(new RTCIceCandidate(c));
    
    const candidates = [];
    this.pc.onicecandidate = e => { if (e.candidate) candidates.push(e.candidate); };
    
    await this.pc.setLocalDescription(await this.pc.createAnswer());
    
    return new Promise(resolve => {
      const check = () => {
        if (this.pc.iceGatheringState === 'complete') {
          resolve(btoa(unescape(encodeURIComponent(JSON.stringify({
            sdp: this.pc.localDescription.sdp,
            candidates: candidates
          })))));
        }
      };
      this.pc.onicegatheringstatechange = check;
      setTimeout(check, 2000);
    });
  }

  async acceptAnswer(code) {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    await this.pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
    for (const c of data.candidates) await this.pc.addIceCandidate(new RTCIceCandidate(c));
  }

  setupChannel() {
    this.channel.onopen = () => { if (this.onOpen) this.onOpen(); };
    this.channel.onmessage = e => { if (this.onData) this.onData(JSON.parse(e.data)); };
  }

  send(data) {
    if (this.channel && this.channel.readyState === 'open') {
      this.channel.send(JSON.stringify(data));
    }
  }
}

// ========== GLOBAL STATE ==========
let p2p = null, isHost = false, isMyTurn = false;
let selectedGame = 'tictactoe';
let currentGame = null;
let gameMode = 'bot';
let botLevel = 'easy';
let bsSize = 8;

const statusEl = document.getElementById('status');
const gameAreaEl = document.getElementById('game-area');
const startBtn = document.getElementById('startBtn');
const modeSel = document.getElementById('mode');
const levelSel = document.getElementById('level');
const bsSizeSel = document.getElementById('bsSize');
const levelRow = document.getElementById('levelRow');
const sizeRow = document.getElementById('sizeRow');
const p2pUI = document.getElementById('p2pUI');
const hostUI = document.getElementById('hostUI');
const guestUI = document.getElementById('guestUI');

function setStatus(t) { statusEl.textContent = t; }
function sendMove(data) { if (p2p) p2p.send({ ...data, _g: selectedGame }); }
function botDelay(fn) { setTimeout(fn, 400); }

// ========== UI LOGIC ==========
document.querySelectorAll('#menu button').forEach(btn => {
  btn.onclick = () => {
    if (p2p) return;
    document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedGame = btn.dataset.game;
    updateSettingsVisibility();
    gameAreaEl.innerHTML = '';
    setStatus(`Выбрано: ${btn.textContent}`);
  };
});
document.querySelector('#menu button').classList.add('active');

modeSel.onchange = () => { gameMode = modeSel.value; updateSettingsVisibility(); };
levelSel.onchange = () => { botLevel = levelSel.value; };
bsSizeSel.onchange = () => { bsSize = parseInt(bsSizeSel.value); };

function updateSettingsVisibility() {
  const isP2P = modeSel.value === 'p2p';
  const isLocal = modeSel.value === 'local';
  const isBS = selectedGame === 'battleship';
  
  levelRow.classList.toggle('hidden', isP2P || isLocal);
  sizeRow.classList.toggle('hidden', !isBS || isP2P);
  p2pUI.classList.toggle('hidden', !isP2P);
  startBtn.classList.toggle('hidden', isP2P);
  
  if (modeSel.value === 'local' && isBS) {
    setStatus('Морской бой недоступен локально. Выберите бота или онлайн.');
    startBtn.disabled = true;
  } else {
    startBtn.disabled = false;
  }
}

// Переключение вкладок Хост/Гость
document.getElementById('tabHost').onclick = () => {
  document.getElementById('tabHost').classList.add('active');
  document.getElementById('tabGuest').classList.remove('active');
  hostUI.classList.remove('hidden');
  guestUI.classList.add('hidden');
  isHost = true;
};
document.getElementById('tabGuest').onclick = () => {
  document.getElementById('tabGuest').classList.add('active');
  document.getElementById('tabHost').classList.remove('active');
  guestUI.classList.remove('hidden');
  hostUI.classList.add('hidden');
  isHost = false;
};

// ========== ЛОГИКА P2P UI ==========
document.getElementById('genCodeBtn').onclick = async () => {
  if (p2p) return;
  p2p = new ManualP2P();
  setStatus('Генерация кода... Пожалуйста, подождите.');
  document.getElementById('genCodeBtn').disabled = true;
  
  const code = await p2p.createOffer();
  document.getElementById('hostCodeOut').value = code;
  setStatus('Код готов! Отправьте его другу.');
};

document.getElementById('finishConnBtn').onclick = async () => {
  const answer = document.getElementById('guestCodeIn').value.trim();
  if (!answer) return alert('Вставьте ответный код!');
  setStatus('Установка соединения...');
  try {
    await p2p.acceptAnswer(answer);
    setupGameConnection();
  } catch(e) {
    setStatus('Ошибка подключения. Проверьте код.');
  }
};

document.getElementById('joinGameBtn').onclick = async () => {
  const offer = document.getElementById('hostCodeIn').value.trim();
  if (!offer) return alert('Вставьте код приглашения!');
  if (p2p) return;
  
  p2p = new ManualP2P();
  setStatus('Генерация ответного кода...');
  document.getElementById('joinGameBtn').disabled = true;
  
  try {
    const answer = await p2p.acceptOffer(offer);
    document.getElementById('guestCodeOut').value = answer;
    setStatus('Ответ готов! Отправьте его хосту.');
    setupGameConnection();
  } catch(e) {
    setStatus('Ошибка. Неверный код приглашения.');
  }
};

function setupGameConnection() {
  p2p.onData = data => {
    if (data.type === 'start') {
      startGame(data.game, false, data.bsSize);
    } else if (currentGame && currentGame.receive) {
      currentGame.receive(data);
    }
  };
  
  p2p.onOpen = () => {
    if (isHost) {
      p2p.send({ type: 'start', game: selectedGame, bsSize: parseInt(bsSizeSel.value) });
      startGame(selectedGame, true);
    }
  };
}

// ========== СТАРТ ИГРЫ ==========
startBtn.onclick = () => {
  gameMode = modeSel.value;
  botLevel = levelSel.value;
  bsSize = parseInt(bsSizeSel.value);
  if (gameMode === 'local' && selectedGame === 'battleship') return;
  isHost = true;
  startGame(selectedGame, true);
};

function startGame(gameName, host, size) {
  isHost = host;
  isMyTurn = true;
  if (gameName === 'battleship' && size) bsSize = size;
  
  const Games = { tictactoe: TicTacToe, chess: ChessG, checkers: RussianCheckers,
                  connect4: Connect4, battleship: Battleship };
  currentGame = Games[gameName];
  currentGame.init();
  currentGame.render();
  
  startBtn.disabled = true;
  modeSel.disabled = true;
  document.querySelectorAll('#menu button').forEach(b => b.disabled = true);
}

function triggerBotIfNeeded() {
  if (gameMode !== 'bot' || !currentGame || currentGame.done) return;
  botDelay(() => {
    if (currentGame.done) return;
    currentGame.botMove();
  });
}

// ========== GAME 1: TIC-TAC-TOE ==========
const TicTacToe = {
  board: null, currentTurn: 'X', done: false,
  init() {
    this.board = Array(9).fill('');
    this.currentTurn = 'X';
    this.done = false;
  },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="ttt-board"></div>';
    const b = document.getElementById('board');
    this.board.forEach((v, i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (v === 'X' ? ' x' : v === 'O' ? ' o' : '');
      c.textContent = v;
      c.onclick = () => this.click(i);
      b.appendChild(c);
    });
    if (!this.done) {
      if (gameMode === 'local') setStatus(`Ход: ${this.currentTurn}`);
      else setStatus(isMyTurn ? 'Ваш ход' : 'Ход противника');
    }
  },
  click(i) {
    if (this.done || this.board[i]) return;
    let symToPlay = gameMode === 'local' ? this.currentTurn : (isHost ? 'X' : 'O');
    if (gameMode !== 'local' && !isMyTurn) return;

    this.board[i] = symToPlay;
    this.render();
    
    if (!this.checkWin()) {
      if (gameMode === 'local') {
        this.currentTurn = this.currentTurn === 'X' ? 'O' : 'X';
        this.render();
      } else if (gameMode === 'p2p') {
        isMyTurn = false;
        sendMove({ index: i });
      } else {
        isMyTurn = false;
        triggerBotIfNeeded();
      }
    }
  },
  receive(data) {
    const opp = isHost ? 'O' : 'X';
    this.board[data.index] = opp;
    isMyTurn = true;
    this.render();
    this.checkWin();
  },
  checkWin() {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const [a,b,c] of wins) {
      if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) {
        this.done = true;
        if (gameMode === 'local') setStatus(`🎉 Победили ${this.board[a]}!`);
        else setStatus(this.board[a] === (isHost?'X':'O') ? '🎉 Вы победили!' : '😢 Вы проиграли');
        return true;
      }
    }
    if (!this.board.includes('')) { this.done = true; setStatus('Ничья'); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    const botSym = isHost ? 'O' : 'X';
    let idx;
    const free = this.board.map((v, i) => v ? null : i).filter(v => v !== null);
    if (free.length === 0) return;

    if (botLevel === 'easy') {
      idx = free[Math.floor(Math.random() * free.length)];
    } else if (botLevel === 'medium') {
      idx = this.mediumMove(botSym);
    } else {
      idx = this.minimaxMove(botSym);
    }
    
    this.board[idx] = botSym;
    this.render();
    if (!this.checkWin()) isMyTurn = true;
  },
  mediumMove(opp) {
    const me = isHost ? 'X' : 'O';
    for (let i = 0; i < 9; i++) {
      if (this.board[i]) continue;
      this.board[i] = opp; if (this.checkStatic(opp)) { this.board[i] = ''; return i; }
      this.board[i] = me; if (this.checkStatic(me)) { this.board[i] = ''; return i; }
      this.board[i] = '';
    }
    if (!this.board[4]) return 4;
    const corners = [0,2,6,8].filter(i => !this.board[i]);
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    return free[Math.floor(Math.random() * free.length)];
  },
  checkStatic(sym) {
    const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return w.some(([a,b,c]) => this.board[a]===sym && this.board[b]===sym && this.board[c]===sym);
  },
  minimaxMove(opp) {
    const me = isHost ? 'X' : 'O';
    let bestScore = -Infinity, bestMove = null;
    for (let i = 0; i < 9; i++) {
      if (this.board[i]) continue;
      this.board[i] = opp;
      const s = this.minimax(false, opp, me, 1);
      this.board[i] = '';
      if (s > bestScore) { bestScore = s; bestMove = i; }
    }
    return bestMove;
  },
  minimax(isMaximizing, opp, me, depth) {
    if (this.checkStatic(opp)) return 10 - depth;
    if (this.checkStatic(me)) return depth - 10;
    if (!this.board.includes('')) return 0;
    let best = isMaximizing ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (this.board[i]) continue;
      this.board[i] = isMaximizing ? opp : me;
      const s = this.minimax(!isMaximizing, opp, me, depth + 1);
      this.board[i] = '';
      best = isMaximizing ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
};

// ========== GAME 2: CHESS ==========
const ChessG = {
  game: null, selected: null, done: false,
  init() { this.game = new Chess(); this.selected = null; this.done = false; },
  myColor() { return gameMode === 'local' ? this.game.turn() : (isHost ? 'w' : 'b'); },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="chess-board"></div>';
    const b = document.getElementById('board');
    const board = this.game.board();
    const sym = {p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚',P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔'};
    const flip = this.myColor() === 'b';
    for (let rr = 0; rr < 8; rr++) for (let cc = 0; cc < 8; cc++) {
      const r = flip ? 7 - rr : rr, c = flip ? 7 - cc : cc;
      const p = board[r][c];
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      if (p) {
        cell.textContent = sym[p.color === 'w' ? p.type.toUpperCase() : p.type];
        cell.style.color = p.color === 'w' ? '#fff' : '#111';
        cell.style.textShadow = p.color === 'w' ? '0 0 2px #000' : '0 0 2px #fff';
      }
      if (this.selected && this.selected.r === r && this.selected.c === c) cell.classList.add('selected');
      cell.onclick = () => this.click(r, c);
      b.appendChild(cell);
    }
    if (!this.done) {
      let s = gameMode === 'local' ? (this.game.turn() === 'w' ? 'Ход белых' : 'Ход чёрных') : (isMyTurn ? 'Ваш ход' : 'Ход противника');
      if (this.game.in_check()) s += ' (шах!)';
      setStatus(s);
    }
  },
  click(r, c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    if (this.selected) {
      const from = String.fromCharCode(97 + this.selected.c) + (8 - this.selected.r);
      const to = String.fromCharCode(97 + c) + (8 - r);
      try {
        if (this.game.move({ from, to, promotion: 'q' })) {
          this.selected = null;
          this.render();
          if (!this.checkEnd()) {
            if (gameMode === 'p2p') { isMyTurn = false; sendMove({ from, to, promotion: 'q' }); }
            else if (gameMode === 'bot') { isMyTurn = false; triggerBotIfNeeded(); }
          }
          return;
        }
      } catch(e) {}
    }
    const piece = this.game.get(String.fromCharCode(97 + c) + (8 - r));
    this.selected = (piece && piece.color === this.myColor()) ? { r, c } : null;
    this.render();
  },
  receive(data) {
    try { this.game.move(data); } catch(e) {}
    isMyTurn = true; this.render(); this.checkEnd();
  },
  checkEnd() {
    if (this.game.in_checkmate()) {
      this.done = true;
      setStatus(gameMode === 'local' ? (this.game.turn() === 'w' ? '🎉 Победили чёрные!' : '🎉 Победили белые!') : (this.game.turn() === this.myColor() ? '😢 Мат! Вы проиграли' : '🎉 Мат! Вы победили'));
      return true;
    }
    if (this.game.in_draw() || this.game.in_stalemate() || this.game.in_threefold_repetition()) {
      this.done = true; setStatus('Ничья'); return true;
    }
    return false;
  },
  botMove() {
    if (this.done) return;
    const moves = this.game.moves({verbose: true});
    if (moves.length === 0) return;
    let chosen = botLevel === 'easy' ? moves[Math.floor(Math.random() * moves.length)] : this.findBest(moves, botLevel === 'medium' ? 1 : 2, isHost ? 'b' : 'w');
    this.game.move(chosen);
    this.render();
    if (!this.checkEnd()) isMyTurn = true;
  },
  findBest(moves, depth, botColor) {
    const botIsWhite = botColor === 'w';
    let best = moves[0], bestScore = botIsWhite ? -Infinity : Infinity;
    for (const m of moves) {
      this.game.move(m);
      const score = this.minimax(depth - 1, !botIsWhite);
      this.game.undo();
      if (botIsWhite ? score > bestScore : score < bestScore) { bestScore = score; best = m; }
    }
    return best;
  },
  minimax(depth, isWhiteTurn) {
    if (depth <= 0 || this.game.game_over()) return this.evaluate();
    const moves = this.game.moves();
    if (moves.length === 0) return this.evaluate();
    let best = isWhiteTurn ? -Infinity : Infinity;
    for (const m of moves) {
      this.game.move(m);
      const s = this.minimax(depth-1, !isWhiteTurn);
      this.game.undo();
      best = isWhiteTurn ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  },
  evaluate() {
    if (this.game.in_checkmate()) return this.game.turn() === 'w' ? -100000 : 100000;
    if (this.game.in_draw() || this.game.in_stalemate()) return 0;
    const vals = {p:100, n:320, b:330, r:500, q:900, k:20000};
    const board = this.game.board();
    let s = 0;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (p) s += (p.color === 'w' ? 1 : -1) * vals[p.type];
    }
    return s;
  }
};

// ========== GAME 3: РУССКИЕ ШАШКИ ==========
const RussianCheckers = {
  board: null, selected: null, done: false, mustCapture: false, captureChain: null, turn: 'w',
  init() {
    this.board = Array(8).fill(null).map(() => Array(8).fill(null));
    for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) this.board[r][c] = { color: 'b', king: false };
    for (let r = 5; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) this.board[r][c] = { color: 'w', king: false };
    this.selected = null; this.done = false; this.mustCapture = false; this.captureChain = null; this.turn = 'w';
  },
  myColor() { return gameMode === 'local' ? this.turn : (isHost ? 'w' : 'b'); },
  getCaptures(r, c) {
    const p = this.board[r][c]; if (!p) return [];
    const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
    const caps = [];
    for (const [dr, dc] of dirs) {
      if (p.king) {
        let mr = r + dr, mc = c + dc, found = false, enemyR = -1, enemyC = -1;
        while (mr >= 0 && mr < 8 && mc >= 0 && mc < 8) {
          if (this.board[mr][mc]) {
            if (this.board[mr][mc].color !== p.color && !found) { found = true; enemyR = mr; enemyC = mc; } else break;
          }
          mr += dr; mc += dc;
        }
        if (found) {
          let landR = enemyR + dr, landC = enemyC + dc;
          while (landR >= 0 && landR < 8 && landC >= 0 && landC < 8 && !this.board[landR][landC]) {
            caps.push({ r: landR, c: landC, cr: enemyR, cc: enemyC });
            landR += dr; landC += dc;
          }
        }
      } else {
        const mr = r + dr, mc = c + dc, nr = r + dr*2, nc = c + dc*2;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
          const mid = this.board[mr][mc];
          if (mid && mid.color !== p.color && !this.board[nr][nc]) caps.push({ r: nr, c: nc, cr: mr, cc: mc });

  },
  getAllCaptures(color) {
    const all = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {

    }
    return all;
  },
  getMoves(r, c) {
    const p = this.board[r][c]; if (!p) return [];
    const dirs = [];
    if (p.king) dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    else if (p.color === 'w') dirs.push([-1,-1],[-1,1]);
    else dirs.push([1,-1],[1,1]);
    const moves = [];
    for (const [dr, dc] of dirs) {
      if (p.king) {
        let nr = r + dr, nc = c + dc;
        while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !this.board[nr][nc]) { moves.push({ r: nr, c: nc }); nr += dr; nc += dc; }
      } else {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !this.board[nr][nc]) moves.push({ r: nr, c: nc });
      }
    }
    return moves;
  },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="checkers-board"></div>';
    const b = document.getElementById('board');
    const flip = this.myColor() === 'b';
    for (let rr = 0; rr < 8; rr++) for (let cc = 0; cc < 8; cc++) {
      const r = flip ? 7 - rr : rr, c = flip ? 7 - cc : cc;
      const p = this.board[r][c];
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      if (p) {
        const sp = document.createElement('span');
        sp.style.cssText = 'width:72%;height:72%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;';
        sp.style.background = p.color === 'w' ? '#fff' : '#222';
        sp.style.color = p.color === 'w' ? '#222' : '#fff';
        sp.style.border = '2px solid ' + (p.color === 'w' ? '#222' : '#fff');
        if (p.king) sp.textContent = '♛';
        cell.appendChild(sp);
      }
      if (this.selected && this.selected.r === r && this.selected.c === c) cell.classList.add('selected');
      cell.onclick = () => this.click(r, c);
      b.appendChild(cell);
    }
    if (!this.done) {
      if (this.captureChain) setStatus('Продолжайте взятие!');
      else if (this.mustCapture) setStatus('Обязательное взятие!');
      else setStatus(gameMode === 'local' ? (this.turn === 'w' ? 'Ход белых' : 'Ход чёрных') : (isMyTurn ? 'Ваш ход' : 'Ход противника'));
    }
  },
  click(r, c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    if (this.captureChain && (this.captureChain.r !== r || this.captureChain.c !== c)) return;
    if (!this.captureChain) this.mustCapture = this.getAllCaptures(this.myColor()).length > 0;
    
    if (this.selected) {
      const sel = this.selected, piece = this.board[sel.r][sel.c];
      const capMove = this.getCaptures(sel.r, sel.c).find(m => m.r === r && m.c === c);
      
      if (capMove) {
        this.board[sel.r][sel.c] = null; this.board[capMove.cr][capMove.cc] = null; this.board[r][c] = piece;
        if (!piece.king && ((piece.color === 'w' && r === 0) || (piece.color === 'b' && r === 7))) piece.king = true;
        this.selected = null; this.render();
        const more = this.getCaptures(r, c);
        if (more.length > 0) { this.captureChain = { r, c }; this.render(); setStatus('Продолжайте взятие!'); return; }
        this.captureChain = null; this.mustCapture = false;
        this.endTurn({ from: {r: sel.r, c: sel.c}, to: {r, c}, capture: {r: capMove.cr, c: capMove.cc} });
        return;
      }
      
      if (!this.mustCapture) {
        const mv = this.getMoves(sel.r, sel.c).find(m => m.r === r && m.c === c);
        if (mv) {
          this.board[sel.r][sel.c] = null; this.board[r][c] = piece;
          if (!piece.king && ((piece.color === 'w' && r === 0) || (piece.color === 'b' && r === 7))) piece.king = true;
          this.selected = null;
          this.endTurn({ from: {r: sel.r, c: sel.c}, to: {r, c} });
          return;
        }
      }
    }
    const p = this.board[r][c];
    if (p && p.color === this.myColor()) {
      if (this.mustCapture && this.getCaptures(r, c).length === 0) { setStatus('Эта шашка не может бить.'); return; }
      this.selected = { r, c };
    } else this.selected = null;
    this.render();
  },
  endTurn(moveData) {
    this.render();
    if (!this.checkEnd()) {
      if (gameMode === 'local') { this.turn = this.turn === 'w' ? 'b' : 'w'; this.render(); }
      else if (gameMode === 'p2p') { isMyTurn = false; sendMove(moveData); }
      else { isMyTurn = false; triggerBotIfNeeded(); }
    }
  },
  receive(data) {
    const { from, to, capture } = data;
    const piece = this.board[from.r][from.c];
    this.board[from.r][from.c] = null; if (capture) this.board[capture.r][capture.c] = null; this.board[to.r][to.c] = piece;
    if (!piece.king && ((piece.color === 'w' && to.r === 0) || (piece.color === 'b' && to.r === 7))) piece.king = true;
    isMyTurn = true; this.mustCapture = false; this.captureChain = null; this.render(); this.checkEnd();
  },
  checkEnd() {
    let w = 0, b = 0;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = this.board[r][c]; if (p) p.color === 'w' ? w++ : b++; }
    if ((this.myColor() === 'w' && b === 0) || (this.myColor() === 'b' && w === 0)) { this.done = true; setStatus(gameMode === 'local' ? '🎉 Победа!' : '🎉 Вы победили!'); return true; }
    if ((this.myColor() === 'w' && w === 0) || (this.myColor() === 'b' && b === 0)) { this.done = true; setStatus(gameMode === 'local' ? '🎉 Победа!' : '😢 Вы проиграли'); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    const botColor = isHost ? 'b' : 'w';
    const caps = this.getAllCaptures(botColor);
    const allMoves = caps.length > 0 ? caps.map(c => ({...c, isCapture: true})) : (() => {
      const m = []; for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = this.board[r][c]; if (p && p.color === botColor) for (const mv of this.getMoves(r, c)) m.push({ from: {r, c}, ...mv, isCapture: false }); } return m;
    })();
    if (allMoves.length === 0) return;
    this.executeBotMove(allMoves[Math.floor(Math.random() * allMoves.length)], botColor);
  },
  executeBotMove(m, color) {
    const piece = this.board[m.from.r][m.from.c];
    this.board[m.from.r][m.from.c] = null; if (m.cr !== undefined) this.board[m.cr][m.cc] = null; this.board[m.r][m.c] = piece;
    if (!piece.king && ((piece.color === 'w' && m.r === 0) || (piece.color === 'b' && m.r === 7))) piece.king = true;
    if (m.isCapture) {
      const further = this.getCaptures(m.r, m.c);
      if (further.length > 0) {
        this.render();
        botDelay(() => { if (!this.done) this.executeBotMove({ from: {r: m.r, c: m.c}, ...further[Math.floor(Math.random() * further.length)], isCapture: true }, color); });
        return;
      }
    }
    this.render(); if (!this.checkEnd()) isMyTurn = true;
  }
};

const Connect4 = {
  board: null, turn: 'R', done: false,
  init() { this.board = Array(6).fill(null).map(() => Array(7).fill('')); this.turn = 'R'; this.done = false; },
  render() {

      const cell = document.createElement('div'); cell.className = 'cell';
      if (this.board[r][c] === 'R') cell.classList.add('red');
      if (this.board[r][c] === 'Y') cell.classList.add('yellow');

    }
    if (!this.done) setStatus(gameMode === 'local' ? `Ход: ${this.turn === 'R' ? 'Красные' : 'Жёлтые'}` : (isMyTurn ? 'Ваш ход' : 'Ход противника'));
  },
  click(c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    let sym = gameMode === 'local' ? this.turn : (isHost ? 'R' : 'Y');
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][c]) { r = i; break; }
    if (r === -1) return;
    this.board[r][c] = sym; this.render();
    if (!this.checkWin(r, c)) {
      if (gameMode === 'local') { this.turn = this.turn === 'R' ? 'Y' : 'R'; this.render(); }
      else if (gameMode === 'p2p') { isMyTurn = false; sendMove({ col: c }); }
      else { isMyTurn = false; triggerBotIfNeeded(); }
    }
  },
  receive(data) {
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][data.col]) { r = i; break; }
    if (r === -1) return;
    this.board[r][data.col] = isHost ? 'Y' : 'R'; isMyTurn = true; this.render(); this.checkWin(r, data.col);
  },
  checkWin(r, c) {
    const color = this.board[r][c]; if (!color) return false;
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
      let count = 1;
      for (let s = 1; s < 4; s++) { const nr = r + dr*s, nc = c + dc*s; if (nr<0||nr>=6||nc<0||nc>=7||this.board[nr][nc]!==color) break; count++; }
      for (let s = 1; s < 4; s++) { const nr = r - dr*s, nc = c - dc*s; if (nr<0||nr>=6||nc<0||nc>=7||this.board[nr][nc]!==color) break; count++; }
      if (count >= 4) { this.done = true; setStatus(gameMode === 'local' ? `🎉 Победили ${color === 'R' ? 'Красные' : 'Жёлтые'}!` : (color === (isHost?'R':'Y') ? '🎉 Вы победили!' : '😢 Вы проиграли')); return true; }
    }
    if (this.board[0].every(v => v)) { this.done = true; setStatus('Ничья'); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    const botSym = isHost ? 'Y' : 'R';
    let free = []; for (let c = 0; c < 7; c++) if (!this.board[0][c]) free.push(c);
    if (free.length === 0) return;
    let col = free[Math.floor(Math.random() * free.length)]; // easy
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][col]) { r = i; break; }
    this.board[r][col] = botSym; this.render(); if (!this.checkWin(r, col)) isMyTurn = true;
  }
};

  },
  click(r, c) {
    if (this.placing || this.done || !isMyTurn || this.shotsByMe[r][c]) return;
    if (gameMode === 'p2p') { sendMove({ fire: { r, c } }); isMyTurn = false; setStatus('Ожидание результата...'); }
    else { this.playerFire(r, c); if (!this.done) triggerBotIfNeeded(); }
  },
  playerFire(r, c) {
    const hit = this.shipsBot ? this.shipsBot[r][c] : false;
    this.shotsByMe[r][c] = hit ? 'hit' : 'miss';
    let allSunk = true; if (this.shipsBot) { for (let rr = 0; rr < this.SIZE; rr++) for (let cc = 0; cc < this.SIZE; cc++) if (this.shipsBot[rr][cc] && this.shotsByMe[rr][cc] !== 'hit') allSunk = false; }
    if (allSunk && this.shipsBot) { this.done = true; setStatus('🎉 Вы победили!'); } else if (hit) setStatus('Попадание! Стреляйте ещё'); else { setStatus('Промах. Ход противника'); isMyTurn = false; }
    this.render();
  },
  receive(data) {
    if (data.type === 'placement') { this.placing = false; this.render(); return; }
    if (data.fire) {
      const { r, c } = data.fire; const hit = this.shipsAtMe[r][c];
      this.shotsAtMe[r][c] = hit ? 'hit' : 'miss';
      let allSunk = true; for (let rr = 0; rr < this.SIZE; rr++) for (let cc = 0; cc < this.SIZE; cc++) if (this.shipsAtMe[rr][cc] && this.shotsAtMe[rr][cc] !== 'hit') allSunk = false;
      sendMove({ result: { r, c, hit, gameOver: allSunk } });
      if (allSunk) { this.done = true; setStatus('😢 Все ваши корабли потоплены'); } else isMyTurn = !hit;
      this.render();
    } else if (data.result) {
      const { r, c, hit, gameOver } = data.result; this.shotsByMe[r][c] = hit ? 'hit' : 'miss';
      if (gameOver) { this.done = true; setStatus('🎉 Вы победили!'); } else isMyTurn = hit;
      this.render();
    }
  },
  botMove() {
    if (this.done) return; const S = this.SIZE;
    if (!this.shipsBot) {
      this.shipsBot = Array(S).fill(null).map(() => Array(S).fill(false));
      for (const size of this.shipSizes) {
        let placed = false, tries = 0;
        while (!placed && tries < 1000) {
          tries++; const horiz = Math.random() < 0.5;
          const r = Math.floor(Math.random() * (horiz ? S : S - size + 1)); const c = Math.floor(Math.random() * (horiz ? S - size + 1 : S));
          if (this.canPlace(r, c, size, horiz, this.shipsBot)) { for (let i = 0; i < size; i++) { const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0); this.shipsBot[rr][cc] = true; } placed = true; }
        }
      }
    }
    let target = null;
    if (botLevel !== 'easy') { while (this.botQueue.length > 0 && !target) { const t = this.botQueue.shift(); if (!this.shotsAtMe[t.r][t.c]) target = t; } }
    if (!target) {
      const avail = []; for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) { if (this.shotsAtMe[r][c]) continue; if (botLevel === 'hard' && (r + c) % 2 !== 0) continue; avail.push({ r, c }); }
      if (avail.length === 0) { for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) if (!this.shotsAtMe[r][c]) avail.push({ r, c }); }
      target = avail[Math.floor(Math.random() * avail.length)];
    }
    if (!target) return; const { r, c } = target; const hit = this.shipsAtMe[r][c];
    this.shotsAtMe[r][c] = hit ? 'hit' : 'miss';
    if (hit && botLevel !== 'easy') { for (const [dr, dc] of [[0,1],[1,0],[0,-1],[-1,0]]) { const nr = r + dr, nc = c + dc; if (nr >= 0 && nr < S && nc >= 0 && nc < S && !this.shotsAtMe[nr][nc]) this.botQueue.push({ r: nr, c: nc }); } }
    let allSunk = true; for (let rr = 0; rr < S; rr++) for (let cc = 0; cc < S; cc++) if (this.shipsAtMe[rr][cc] && this.shotsAtMe[rr][cc] !== 'hit') allSunk = false;
    this.render();
    if (allSunk) { this.done = true; setStatus('😢 Бот потопил ваш флот'); return; }
    if (hit) { setStatus('Бот попал! Бот стреляет ещё...'); botDelay(() => { if (!this.done) this.botMove(); }); } else { setStatus('Бот промахнулся. Ваш ход'); isMyTurn = true; }
  }
};
</script>
