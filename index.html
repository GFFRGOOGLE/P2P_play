<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мини-игры P2P</title>
<meta name="theme-color" content="#ece2cd">
<style>
:root {
  --paper: #ece2cd; --paper-d: #ddd0b2; --ink: #26201a; --ink-soft: #5a4a38;
  --seal: #8b2019; --gold: #9c7a2c; --frame: #3a2c1c; --card: rgba(58,44,28,.05);
  --shadow: rgba(58,44,28,.2); --overlay-bg: rgba(30,22,14,.72);
}
body.dark {
  --paper: #1a1714; --paper-d: #24201a; --ink: #e8dfd0; --ink-soft: #a89880;
  --seal: #d4513f; --gold: #d4a94c; --frame: #4a3a28; --card: rgba(232,223,208,.05);
  --shadow: rgba(0,0,0,.5); --overlay-bg: rgba(0,0,0,.85);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%; font-family: Georgia, serif;
  background: var(--paper); color: var(--ink);
  transition: background .3s, color .3s; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 50% 40% at 20% 15%, rgba(180,140,80,.15), transparent 70%),
              radial-gradient(ellipse 55% 45% at 80% 85%, rgba(140,100,50,.12), transparent 70%);
}
body.dark::before { opacity: .15; }
.frame { position: fixed; inset: 12px; border: 1px solid var(--frame); opacity: .4; pointer-events: none; z-index: 5; }
.frame::before { content: ''; position: absolute; inset: 4px; border: 1px solid var(--frame); opacity: .5; }

.container { max-width: 900px; margin: 0 auto; padding: 30px 15px; position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
h1 { font-size: clamp(24px, 5vw, 40px); margin-bottom: 20px; letter-spacing: 0.05em; text-align: center; text-transform: uppercase; }

#top-bar { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; width: 100%; flex-wrap: wrap; position: relative; z-index: 100; }
#top-bar button { padding: 8px 16px; font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; background: var(--card); color: var(--ink); border: 1px solid var(--frame); cursor: pointer; text-transform: uppercase; transition: 0.1s; }
#top-bar button:hover { background: var(--paper-d); }
#top-bar button.btn-seal { background: var(--seal); color: var(--paper); border-color: var(--seal); }

.panel { background: var(--paper); border: 1px solid var(--frame); box-shadow: 4px 4px 0 var(--shadow); padding: 20px; width: 100%; max-width: 700px; margin-bottom: 20px; position: relative; }
.panel::before { content: ''; position: absolute; inset: 4px; border: 1px solid var(--frame); pointer-events: none; opacity: .2; }

#menu { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; width: 100%; }
#menu button { padding: 10px 16px; font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; background: var(--card); color: var(--ink); border: 1px solid var(--frame); cursor: pointer; text-transform: uppercase; transition: 0.1s; flex: 1; min-width: 120px; }
#menu button:hover { background: var(--paper-d); }
#menu button.active { background: var(--seal); color: var(--paper); border-color: var(--seal); }
#menu button:disabled { opacity: 0.5; cursor: not-allowed; }

#settings { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 20px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--frame); background: var(--card); }
.setting-row label { font-size: 14px; font-weight: bold; }
.setting-row select { padding: 8px; font-family: 'Courier New', monospace; font-size: 12px; background: var(--paper); border: 1px solid var(--frame); color: var(--ink); outline: none; }

.btn { padding: 12px 24px; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; color: var(--paper); background: var(--ink); border: 1px solid var(--frame); cursor: pointer; text-transform: uppercase; box-shadow: 3px 3px 0 var(--shadow); transition: 0.1s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
.btn-seal { background: var(--seal); }
.btn-secondary { background: var(--paper); color: var(--ink); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }

#status { font-size: 16px; font-weight: bold; text-align: center; min-height: 24px; margin-bottom: 20px; font-family: 'Courier New', monospace; color: var(--seal); text-transform: uppercase; letter-spacing: 0.1em; }
#game-area { display: flex; justify-content: center; width: 100%; margin-bottom: 20px; min-height: 50px; position: relative; }
.hidden { display: none !important; }

/* Доски */
.ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); width: min(300px, 80vw); aspect-ratio: 1; gap: 4px; background: var(--frame); border: 4px solid var(--frame); position: relative; }
.ttt-board .cell { background: var(--paper); display: flex; justify-content: center; align-items: center; font-size: min(15vw, 60px); font-weight: bold; cursor: pointer; font-family: Georgia, serif; color: var(--ink); }
.ttt-board .cell:hover { background: var(--paper-d); }
.ttt-board .cell.x { color: var(--ink); }
.ttt-board .cell.o { color: var(--seal); }
.ttt-board .cell.win { background: var(--gold); color: var(--paper); }
.ttt-line { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
.ttt-line line { stroke: var(--seal); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawLine 0.4s ease forwards; }
@keyframes drawLine { to { stroke-dashoffset: 0; } }

.chess-board, .checkers-board { display: grid; grid-template-columns: repeat(8, 1fr); width: min(400px, 90vw); aspect-ratio: 1; border: 4px solid var(--frame); background: var(--frame); gap: 1px; }
.chess-board .cell, .checkers-board .cell { display: flex; justify-content: center; align-items: center; font-size: min(8vw, 32px); cursor: pointer; position: relative; }
.chess-board .light, .checkers-board .light { background: var(--paper); color: var(--ink); }
.chess-board .dark, .checkers-board .dark { background: var(--paper-d); color: var(--ink); }
.chess-board .cell.selected, .checkers-board .cell.selected { box-shadow: inset 0 0 0 4px var(--gold); }
.chess-board .piece-w { text-shadow: 0 1px 0 rgba(255,255,255,0.8); }
.chess-board .piece-b { text-shadow: 0 1px 0 rgba(0,0,0,0.2); }
.checker-w { width: 70%; height: 70%; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); display: flex; justify-content: center; align-items: center; font-size: 14px; color: var(--ink); font-weight: bold; }
.checker-b { width: 70%; height: 70%; border-radius: 50%; background: var(--ink); border: 3px solid var(--ink); display: flex; justify-content: center; align-items: center; font-size: 14px; color: var(--paper); font-weight: bold; }

.c4-board { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); width: min(350px, 90vw); aspect-ratio: 7/6; background: var(--frame); border: 4px solid var(--frame); gap: 4px; padding: 4px; }
.c4-board .cell { background: var(--paper); border-radius: 50%; cursor: pointer; box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }
.c4-board .cell.red { background: var(--seal); }
.c4-board .cell.yellow { background: var(--gold); }

.bs-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; }
.bs-board { display: grid; gap: 2px; background: var(--frame); border: 2px solid var(--frame); padding: 2px; }
.bs-board .cell { background: var(--paper); width: min(8vw, 30px); height: min(8vw, 30px); display: flex; justify-content: center; align-items: center; font-size: 12px; cursor: pointer; color: var(--ink); }
.bs-board .cell.ship { background: var(--paper-d); border: 1px solid var(--ink-soft); }
.bs-board .cell.hit { background: var(--seal); color: var(--paper); }
.bs-board .cell.miss { background: var(--ink-soft); }
.bs-title { text-align: center; font-family: 'Courier New', monospace; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }

.p2p-box { width: 100%; display: flex; flex-direction: column; gap: 10px; background: var(--card); padding: 15px; border: 1px dashed var(--frame); margin-top: 10px; }
.p2p-box input { width: 100%; padding: 10px; font-family: monospace; font-size: 11px; border: 1px solid var(--frame); background: var(--paper); color: var(--ink); }
.p2p-box button { padding: 10px; background: var(--ink); color: var(--paper); border: none; font-family: 'Courier New', monospace; font-weight: bold; cursor: pointer; text-transform: uppercase; }
.p2p-box button:disabled { opacity: 0.5; cursor: not-allowed; }
.connect-status { font-size:12px; text-align:center; font-weight:bold; color:var(--seal); margin-top:10px; font-family: 'Courier New', monospace;}

#theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 1000; padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; background: var(--paper); color: var(--ink); border: 1px solid var(--frame); cursor: pointer; text-transform: uppercase; box-shadow: 2px 2px 0 var(--shadow); transition: 0.1s; }
#theme-toggle:hover { background: var(--paper-d); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--shadow); }

/* Модалки */
.modal { position: fixed; inset: 0; background: var(--overlay-bg); z-index: 2000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px; }
.modal.open { opacity: 1; pointer-events: auto; }
.modal-content { background: var(--paper); border: 1px solid var(--frame); box-shadow: 6px 6px 0 var(--shadow); width: 100%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; position: relative; }
.modal-header { padding: 15px 20px; border-bottom: 1px solid var(--frame); font-family: 'Courier New', monospace; font-weight: bold; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink); font-weight: bold; }

.ach-item { display: flex; align-items: center; gap: 15px; padding: 10px; border: 1px solid var(--frame); margin-bottom: 10px; background: var(--card); }
.ach-item.unlocked { border-color: var(--gold); background: rgba(156,122,44,0.1); }
.ach-icon { font-size: 24px; width: 40px; text-align: center; filter: grayscale(1); opacity: 0.5; }
.ach-item.unlocked .ach-icon { filter: none; opacity: 1; }
.ach-info { flex: 1; }
.ach-title { font-weight: bold; font-size: 14px; }
.ach-desc { font-size: 12px; color: var(--ink-soft); font-family: 'Courier New', monospace; margin-top: 3px; }
.ach-status { font-size: 11px; font-weight: bold; color: var(--gold); text-transform: uppercase; }

.ach-toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--ink); color: var(--paper); padding: 15px 30px; border: 2px solid var(--gold); font-family: 'Courier New', monospace; font-weight: bold; z-index: 3000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.ach-toast.show { transform: translateX(-50%) translateY(0); }
.ach-toast .title { color: var(--gold); font-size: 12px; text-transform: uppercase; margin-bottom: 5px; }
.ach-toast .name { font-size: 18px; color: var(--paper); }

@media (max-width: 600px) {
  .container { padding: 15px 10px; }
  .setting-row { flex-direction: column; align-items: flex-start; gap: 5px; }
  .setting-row select { width: 100%; }
  .btn { width: 100%; }
  #theme-toggle { top: 10px; right: 10px; font-size: 9px; padding: 6px 8px; }
}
</style>
</head>
<body>

<div class="frame"></div>
<button id="theme-toggle">Тёмная тема</button>

<div class="container">
  <h1>Мини-игры</h1>
  
  <div id="top-bar">
    <button id="btn-achievements" class="btn-seal">Достижения</button>
    <button id="btn-championship">Чемпионат</button>
  </div>

  <div id="menu">
    <button data-game="tictactoe" class="active">Крестики-нолики</button>
    <button data-game="chess">Шахматы</button>
    <button data-game="checkers">Русские шашки</button>
    <button data-game="connect4">4 в ряд</button>
    <button data-game="battleship">Морской бой</button>
  </div>

  <div class="panel">
    <div id="settings">
      <div class="setting-row">
        <label>Режим игры</label>
        <select id="mode">
          <option value="bot">С ботом</option>
          <option value="local">Локально (2 игрока)</option>
          <option value="p2p">Онлайн P2P (Безопасная ссылка)</option>
        </select>
      </div>
      <div class="setting-row" id="levelRow">
        <label>Сложность бота</label>
        <select id="level">
          <option value="easy">Лёгкий</option>
          <option value="medium">Средний</option>
          <option value="hard">Сложный</option>
        </select>
      </div>
      <div class="setting-row" id="sizeRow">
        <label>Размер поля (Морской бой)</label>
        <select id="bsSize">
          <option value="8">8×8 (быстрый)</option>
          <option value="10">10×10 (классика)</option>
        </select>
      </div>
    </div>

    <div id="status">Выберите игру и настройки</div>
    <div id="game-area"></div>

    <div class="btn-row">
      <button id="startBtn" class="btn btn-seal">Начать игру</button>
      <button id="backBtn" class="btn btn-secondary hidden">Вернуться в меню</button>
    </div>

    <!-- Блок P2P по ссылке -->
    <div id="p2pUI" class="hidden p2p-box">
      <div id="hostUI">
        <p style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">1. Создайте защищенную ссылку и отправьте её другу.</p>
        <button id="genLinkBtn" class="btn-seal" style="margin-bottom:10px; width:100%;">Создать ссылку-приглашение</button>
        <input type="text" id="hostLinkOut" readonly placeholder="Здесь появится ссылка...">
      </div>
      <div id="guestUI" class="hidden">
        <p style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">Вы перешли по ссылке приглашения. Ожидайте подключения или нажмите кнопку.</p>
        <button id="joinLinkBtn" class="btn-seal" style="margin-bottom:10px; width:100%;">Подключиться к игре</button>
      </div>
      <div id="connectStatus" class="connect-status"></div>
    </div>
  </div>
</div>

<!-- Модальное окно достижений -->
<div class="modal" id="achModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>Достижения</span>
      <button class="modal-close" id="closeAchModal">×</button>
    </div>
    <div class="modal-body" id="achList"></div>
  </div>
</div>

<div class="ach-toast" id="achToast">
  <div class="title">Получено достижение!</div>
  <div class="name" id="achToastName"></div>
</div>

<script type="module">
import { joinRoom } from 'https://esm.run/trystero';

// ========== СИСТЕМА СОХРАНЕНИЙ ==========
const SaveManager = {
  data: { achievements: [], stats: { played: 0, wins: 0, losses: 0, draws: 0 }, champWins: 0 },
  load() {
    const saved = localStorage.getItem('minigames_progress');
    if (saved) { try { this.data = JSON.parse(saved); } catch(e) {} }
    if (!this.data.achievements) this.data.achievements = [];
    if (!this.data.stats) this.data.stats = { played: 0, wins: 0, losses: 0, draws: 0 };
  },
  save() { localStorage.setItem('minigames_progress', JSON.stringify(this.data)); },
  unlock(id) {
    if (!this.data.achievements.includes(id)) {
      this.data.achievements.push(id);
      this.save();
      showAchievementToast(id);
    }
  },
  addStat(type) {
    this.data.stats.played++;
    if (type === 'win') this.data.stats.wins++;
    if (type === 'lose') this.data.stats.losses++;
    if (type === 'draw') this.data.stats.draws++;
    this.save();
    checkAchievements();
  }
};
SaveManager.load();

const ACHIEVEMENTS_DB = {
  first_win: { title: "Первая победа", desc: "Выиграйте первую игру", icon: "🏆" },
  play_10: { title: "Ветеран", desc: "Сыграйте 10 игр", icon: "🎖️" },
  champ_1: { title: "Чемпион", desc: "Выиграйте чемпионат", icon: "👑" },
  ttt_hard: { title: "Мастер ХО", desc: "Победите в крестиках-ноликах на сложном", icon: "❌" },
  chess_hard: { title: "Гроссмейстер", desc: "Победите в шахматах на сложном", icon: "♞" },
  check_hard: { title: "Дамка", desc: "Победите в шашках на сложном", icon: "⚫" },
  c4_hard: { title: "Четыре в ряд", desc: "Победите в 4 в ряд на сложном", icon: "🔴" },
  bs_hard: { title: "Адмирал", desc: "Победите в морском бою на сложном", icon: "🚢" }
};

function showAchievementToast(id) {
  const ach = ACHIEVEMENTS_DB[id]; if (!ach) return;
  const toast = document.getElementById('achToast');
  document.getElementById('achToastName').textContent = ach.title;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function checkAchievements() {
  const s = SaveManager.data.stats;
  if (s.wins >= 1) SaveManager.unlock('first_win');
  if (s.played >= 10) SaveManager.unlock('play_10');
  if (SaveManager.data.champWins >= 1) SaveManager.unlock('champ_1');
}

function renderAchievements() {
  const list = document.getElementById('achList'); list.innerHTML = '';
  for (const [id, ach] of Object.entries(ACHIEVEMENTS_DB)) {
    const unlocked = SaveManager.data.achievements.includes(id);
    const div = document.createElement('div');
    div.className = 'ach-item' + (unlocked ? ' unlocked' : '');
    div.innerHTML = `
      <div class="ach-icon">${ach.icon}</div>
      <div class="ach-info"><div class="ach-title">${ach.title}</div><div class="ach-desc">${ach.desc}</div></div>
      <div class="ach-status">${unlocked ? 'Получено' : 'Закрыто'}</div>`;
    list.appendChild(div);
  }
}

document.getElementById('btn-achievements').onclick = () => { renderAchievements(); document.getElementById('achModal').classList.add('open'); };
document.getElementById('closeAchModal').onclick = () => document.getElementById('achModal').classList.remove('open');

function onGameEnd(result, gameName, difficulty) {
  if (result === 'win') {
    SaveManager.addStat('win');
    if (difficulty === 'hard') {
      if (gameName === 'tictactoe') SaveManager.unlock('ttt_hard');
      if (gameName === 'chess') SaveManager.unlock('chess_hard');
      if (gameName === 'checkers') SaveManager.unlock('check_hard');
      if (gameName === 'connect4') SaveManager.unlock('c4_hard');
      if (gameName === 'battleship') SaveManager.unlock('bs_hard');
    }
    if (gameMode === 'championship') { SaveManager.data.champWins++; SaveManager.save(); checkAchievements(); }
  } else if (result === 'lose') SaveManager.addStat('lose');
  else if (result === 'draw') SaveManager.addStat('draw');
}

// ========== ЧЕМПИОНАТ ==========
document.getElementById('btn-championship').onclick = () => {
  if (room) { alert('Завершите текущую P2P игру!'); return; }
  const games = ['tictactoe', 'chess', 'checkers', 'connect4', 'battleship'];
  const diffs = ['medium', 'hard'];
  const randomGame = games[Math.floor(Math.random() * games.length)];
  const randomDiff = diffs[Math.floor(Math.random() * diffs.length)];
  
  document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
  document.querySelector(`#menu button[data-game="${randomGame}"]`).classList.add('active');
  document.getElementById('mode').value = 'bot';
  document.getElementById('level').value = randomDiff;
  
  selectedGame = randomGame; gameMode = 'championship'; botLevel = randomDiff; bsSize = 10;
  updateSettingsVisibility(); isHost = true;
  alert(`ЧЕМПИОНАТ!\nИгра: ${randomGame.toUpperCase()}\nСложность: ${randomDiff.toUpperCase()}\nУдачи!`);
  startGame(selectedGame, true);
};

// ========== ТЕМА ==========
const themeToggle = document.getElementById('theme-toggle');
const savedTheme = localStorage.getItem('theme') || 'light';
if (savedTheme === 'dark') { document.body.classList.add('dark'); themeToggle.textContent = 'Светлая тема'; }
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  themeToggle.textContent = isDark ? 'Светлая тема' : 'Тёмная тема';
});

// ========== БЕЗОПАСНЫЙ P2P ЧЕРЕЗ TRYSTERO ==========
const APP_ID = 'minigames-pro-secure-v1';
let room = null;
let isHost = false;
let isMyTurn = false;

function generateSecureRoomId() {
  const array = new Uint8Array(16); // 128 бит
  window.crypto.getRandomValues(array);
  return Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
}

function joinGameRoom(roomId, host) {
  isHost = host;
  // ID комнаты используется и как пароль для шифрования канала
  room = joinRoom({ appId: APP_ID }, roomId, roomId);

  room.onPeerJoin = (peerId) => {
    // ЗАЩИТА ОТ ПОДБОРА: Пускаем только 1 гостя (всего 2 игрока)
    const peers = Object.keys(room.getPeers());
    if (peers.length > 1) {
      console.warn("Комната заполнена. Отклонено:", peerId);
      return; 
    }
    
    document.getElementById('connectStatus').textContent = 'Соединение установлено!';
    if (isHost) {
      room.makeAction('start')({ game: selectedGame, bsSize: parseInt(bsSizeSel.value) });
      startGame(selectedGame, true);
    }
  };

  room.makeAction('start').onMessage = (data) => {
    startGame(data.game, false, data.bsSize);
  };

  // Обработка ходов
  room.makeAction('move').onMessage = (data) => {
    if (currentGame && currentGame.receive) currentGame.receive(data);
  };
  
  room.makeAction('gameover').onMessage = (data) => {
    const msg = data.result === 'win' ? 'Вы проиграли' : (data.result === 'lose' ? 'Вы победили' : 'Ничья');
    setStatus(msg);
    currentGame.done = true;
  };
}

}

// ========== ИГРЫ ==========
const TicTacToe = {
  board: null, currentTurn: 'X', done: false, winCombo: null,
  init() { this.board = Array(9).fill(''); this.currentTurn = 'X'; this.done = false; this.winCombo = null; },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="ttt-board"></div>';
    const b = document.getElementById('board');
    this.board.forEach((v, i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (v === 'X' ? ' x' : v === 'O' ? ' o' : '');
      if (this.winCombo && this.winCombo.includes(i)) c.classList.add('win');
      c.textContent = v; c.onclick = () => this.click(i); b.appendChild(c);
    });
    if (this.winCombo) this.drawWinLine();
    if (!this.done) {
      if (gameMode === 'local') setStatus(`Ход: ${this.currentTurn}`);
      else setStatus(isMyTurn ? 'Ваш ход' : 'Ход противника');
    }
  },
  drawWinLine() {
    const board = document.getElementById('board');
    const [a, b, c] = this.winCombo;
    const coords = [
      { x: 16.6, y: 16.6 }, { x: 50, y: 16.6 }, { x: 83.3, y: 16.6 },
      { x: 16.6, y: 50 }, { x: 50, y: 50 }, { x: 83.3, y: 50 },
      { x: 16.6, y: 83.3 }, { x: 50, y: 83.3 }, { x: 83.3, y: 83.3 }
    ];
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'ttt-line'); svg.setAttribute('viewBox', '0 0 100 100');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', coords[a].x); line.setAttribute('y1', coords[a].y);
    line.setAttribute('x2', coords[c].x); line.setAttribute('y2', coords[c].y);
    svg.appendChild(line); board.appendChild(svg);
  },
  click(i) {
    if (this.done || this.board[i]) return;
    let symToPlay = gameMode === 'local' ? this.currentTurn : (isHost ? 'X' : 'O');
    if (gameMode !== 'local' && !isMyTurn) return;
    this.board[i] = symToPlay; this.render();
    if (!this.checkWin()) {
      if (gameMode === 'local') { this.currentTurn = this.currentTurn === 'X' ? 'O' : 'X'; this.render(); }
      else if (gameMode === 'p2p') { isMyTurn = false; sendMove({ index: i }); }
      else { isMyTurn = false; triggerBotIfNeeded(); }
    }
  },
  receive(data) { const opp = isHost ? 'O' : 'X'; this.board[data.index] = opp; isMyTurn = true; this.render(); this.checkWin(); },
  checkWin() {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const combo of wins) {
      const [a,b,c] = combo;
      if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) {
        this.done = true; this.winCombo = combo; this.render();
        if (gameMode === 'local') setStatus(`Победили ${this.board[a]}`);
        else {
          const win = this.board[a] === (isHost ? 'X' : 'O');
          setStatus(win ? 'Вы победили' : 'Вы проиграли');
          if (gameMode === 'p2p') room.makeAction('gameover')({ result: win ? 'win' : 'lose' });
          else onGameEnd(win ? 'win' : 'lose', selectedGame, botLevel);
        }
        return true;
      }
    }
    if (!this.board.includes('')) { this.done = true; setStatus('Ничья'); if(gameMode !== 'local' && gameMode !== 'p2p') onGameEnd('draw', selectedGame, botLevel); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    const botSym = isHost ? 'O' : 'X';
    let idx; const free = this.board.map((v, i) => v ? null : i).filter(v => v !== null);
    if (free.length === 0) return;
    if (botLevel === 'easy') idx = free[Math.floor(Math.random() * free.length)];
    else if (botLevel === 'medium') idx = this.mediumMove(botSym);
    else idx = this.minimaxMove(botSym);
    this.board[idx] = botSym; this.render(); if (!this.checkWin()) isMyTurn = true;
  },
  mediumMove(opp) {
    const me = isHost ? 'X' : 'O';
    for (let i = 0; i < 9; i++) {
      if (this.board[i]) continue;
      this.board[i] = opp; if (this.checkStatic(opp)) { this.board[i] = ''; return i; }
      this.board[i] = me; if (this.checkStatic(me)) { this.board[i] = ''; return i; }
      this.board[i] = '';
    }
    if (!this.board[4]) return 4;
    const corners = [0,2,6,8].filter(i => !this.board[i]);
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    return this.board.map((v, i) => v ? null : i).filter(v => v !== null)[Math.floor(Math.random() * free.length)];
  },
  checkStatic(sym) { const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return w.some(([a,b,c]) => this.board[a]===sym && this.board[b]===sym && this.board[c]===sym); },
  minimaxMove(opp) {
    const me = isHost ? 'X' : 'O'; let bestScore = -Infinity, bestMove = null;
    for (let i = 0; i < 9; i++) {
      if (this.board[i]) continue;
      this.board[i] = opp; const s = this.minimax(false, opp, me, 1); this.board[i] = '';
      if (s > bestScore) { bestScore = s; bestMove = i; }
    }
    return bestMove;
  },
  minimax(isMaximizing, opp, me, depth) {
    if (this.checkStatic(opp)) return 10 - depth;
    if (this.checkStatic(me)) return depth - 10;
    if (!this.board.includes('')) return 0;
    let best = isMaximizing ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (this.board[i]) continue;
      this.board[i] = isMaximizing ? opp : me;
      const s = this.minimax(!isMaximizing, opp, me, depth + 1);
      this.board[i] = ''; best = isMaximizing ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
};

const ChessG = {
  game: null, selected: null, done: false,
  init() { this.game = new Chess(); this.selected = null; this.done = false; },
  myColor() { return gameMode === 'local' ? this.game.turn() : (isHost ? 'w' : 'b'); },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="chess-board"></div>';
    const b = document.getElementById('board'); const board = this.game.board();
    const sym = {p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚',P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔'};
    const flip = this.myColor() === 'b';
    for (let rr = 0; rr < 8; rr++) for (let cc = 0; cc < 8; cc++) {
      const r = flip ? 7 - rr : rr, c = flip ? 7 - cc : cc; const p = board[r][c];
      const cell = document.createElement('div'); cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      if (p) { cell.textContent = sym[p.color === 'w' ? p.type.toUpperCase() : p.type]; cell.classList.add(p.color === 'w' ? 'piece-w' : 'piece-b'); }
      if (this.selected && this.selected.r === r && this.selected.c === c) cell.classList.add('selected');
      cell.onclick = () => this.click(r, c); b.appendChild(cell);
    }
    if (!this.done) {
      let s = gameMode === 'local' ? (this.game.turn() === 'w' ? 'Ход белых' : 'Ход чёрных') : (isMyTurn ? 'Ваш ход' : 'Ход противника');
      if (this.game.in_check()) s += ' (шах!)'; setStatus(s);
    }
  },
  click(r, c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    if (this.selected) {
      const from = String.fromCharCode(97 + this.selected.c) + (8 - this.selected.r);
      const to = String.fromCharCode(97 + c) + (8 - r);
      try {
        if (this.game.move({ from, to, promotion: 'q' })) {
          this.selected = null; this.render();
          if (!this.checkEnd()) {
            if (gameMode === 'p2p') { isMyTurn = false; sendMove({ from, to, promotion: 'q' }); }
            else if (gameMode === 'bot' || gameMode === 'championship') { isMyTurn = false; triggerBotIfNeeded(); }
          }
          return;
        }
      } catch(e) {}
    }
    const piece = this.game.get(String.fromCharCode(97 + c) + (8 - r));
    this.selected = (piece && piece.color === this.myColor()) ? { r, c } : null; this.render();
  },
  receive(data) { try { this.game.move(data); } catch(e) {} isMyTurn = true; this.render(); this.checkEnd(); },
  checkEnd() {
    if (this.game.in_checkmate()) {
      this.done = true;
      const win = this.game.turn() !== this.myColor();
      setStatus(gameMode === 'local' ? (this.game.turn() === 'w' ? 'Мат. Победили чёрные' : 'Мат. Победили белые') : (win ? 'Мат. Вы победили' : 'Мат. Вы проиграли'));
      if (gameMode !== 'local' && gameMode !== 'p2p') onGameEnd(win ? 'win' : 'lose', selectedGame, botLevel);
      return true;
    }
    if (this.game.in_draw() || this.game.in_stalemate() || this.game.in_threefold_repetition()) {
      this.done = true; setStatus('Ничья'); if (gameMode !== 'local' && gameMode !== 'p2p') onGameEnd('draw', selectedGame, botLevel); return true;
    }
    return false;
  },
  botMove() {
    if (this.done) return;
    const moves = this.game.moves({verbose: true}); if (moves.length === 0) return;
    let chosen = botLevel === 'easy' ? moves[Math.floor(Math.random() * moves.length)] : this.findBest(moves, botLevel === 'medium' ? 1 : 2, isHost ? 'b' : 'w');
    this.game.move(chosen); this.render(); if (!this.checkEnd()) isMyTurn = true;
  },
  findBest(moves, depth, botColor) {
    const botIsWhite = botColor === 'w'; let best = moves[0], bestScore = botIsWhite ? -Infinity : Infinity;
    for (const m of moves) {
      this.game.move(m); const score = this.minimax(depth - 1, !botIsWhite); this.game.undo();
      if (botIsWhite ? score > bestScore : score < bestScore) { bestScore = score; best = m; }
    }
    return best;
  },
  minimax(depth, isWhiteTurn) {
    if (depth <= 0 || this.game.game_over()) return this.evaluate();
    const moves = this.game.moves(); if (moves.length === 0) return this.evaluate();
    let best = isWhiteTurn ? -Infinity : Infinity;
    for (const m of moves) { this.game.move(m); const s = this.minimax(depth-1, !isWhiteTurn); this.game.undo(); best = isWhiteTurn ? Math.max(best, s) : Math.min(best, s); }
    return best;
  },
  evaluate() {
    if (this.game.in_checkmate()) return this.game.turn() === 'w' ? -100000 : 100000;
    if (this.game.in_draw() || this.game.in_stalemate()) return 0;
    const vals = {p:100, n:320, b:330, r:500, q:900, k:20000}; const board = this.game.board(); let s = 0;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = board[r][c]; if (p) s += (p.color === 'w' ? 1 : -1) * vals[p.type]; }
    return s;
  }
};

const RussianCheckers = {
  board: null, selected: null, done: false, mustCapture: false, captureChain: null, turn: 'w',
  init() {
    this.board = Array(8).fill(null).map(() => Array(8).fill(null));
    for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) this.board[r][c] = { color: 'b', king: false };
    for (let r = 5; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) this.board[r][c] = { color: 'w', king: false };
    this.selected = null; this.done = false; this.mustCapture = false; this.captureChain = null; this.turn = 'w';
  },
  myColor() { return gameMode === 'local' ? this.turn : (isHost ? 'w' : 'b'); },
  getCaptures(r, c) {
    const p = this.board[r][c]; if (!p) return [];
    const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]]; const caps = [];
    for (const [dr, dc] of dirs) {
      if (p.king) {
        let mr = r + dr, mc = c + dc, found = false, enemyR = -1, enemyC = -1;
        while (mr >= 0 && mr < 8 && mc >= 0 && mc < 8) {
          if (this.board[mr][mc]) { if (this.board[mr][mc].color !== p.color && !found) { found = true; enemyR = mr; enemyC = mc; } else break; }
          mr += dr; mc += dc;
        }
        if (found) {
          let landR = enemyR + dr, landC = enemyC + dc;
          while (landR >= 0 && landR < 8 && landC >= 0 && landC < 8 && !this.board[landR][landC]) { caps.push({ r: landR, c: landC, cr: enemyR, cc: enemyC }); landR += dr; landC += dc; }
        }
      } else {
        const mr = r + dr, mc = c + dc, nr = r + dr*2, nc = c + dc*2;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) { const mid = this.board[mr][mc]; if (mid && mid.color !== p.color && !this.board[nr][nc]) caps.push({ r: nr, c: nc, cr: mr, cc: mc }); }
      }
    }
    return caps;
  },
  getAllCaptures(color) {
    const all = [];
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = this.board[r][c]; if (p && p.color === color) for (const cap of this.getCaptures(r, c)) all.push({ from: {r, c}, ...cap }); }
    return all;
  },
  getMoves(r, c) {
    const p = this.board[r][c]; if (!p) return [];
    const dirs = []; if (p.king) dirs.push([-1,-1],[-1,1],[1,-1],[1,1]); else if (p.color === 'w') dirs.push([-1,-1],[-1,1]); else dirs.push([1,-1],[1,1]);
    const moves = [];
    for (const [dr, dc] of dirs) {
      if (p.king) { let nr = r + dr, nc = c + dc; while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !this.board[nr][nc]) { moves.push({ r: nr, c: nc }); nr += dr; nc += dc; } }
      else { const nr = r + dr, nc = c + dc; if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !this.board[nr][nc]) moves.push({ r: nr, c: nc }); }
    }
    return moves;
  },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="checkers-board"></div>';
    const b = document.getElementById('board'); const flip = this.myColor() === 'b';
    for (let rr = 0; rr < 8; rr++) for (let cc = 0; cc < 8; cc++) {
      const r = flip ? 7 - rr : rr, c = flip ? 7 - cc : cc; const p = this.board[r][c];
      const cell = document.createElement('div'); cell.className = 'cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      if (p) { const sp = document.createElement('div'); sp.className = p.color === 'w' ? 'checker-w' : 'checker-b'; if (p.king) sp.textContent = 'K'; cell.appendChild(sp); }
      if (this.selected && this.selected.r === r && this.selected.c === c) cell.classList.add('selected');
      cell.onclick = () => this.click(r, c); b.appendChild(cell);
    }
    if (!this.done) {
      if (this.captureChain) setStatus('Продолжайте взятие');
      else if (this.mustCapture) setStatus('Обязательное взятие');
      else setStatus(gameMode === 'local' ? (this.turn === 'w' ? 'Ход белых' : 'Ход чёрных') : (isMyTurn ? 'Ваш ход' : 'Ход противника'));
    }
  },
  click(r, c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    if (this.captureChain && (this.captureChain.r !== r || this.captureChain.c !== c)) return;
    if (!this.captureChain) this.mustCapture = this.getAllCaptures(this.myColor()).length > 0;
    if (this.selected) {
      const sel = this.selected, piece = this.board[sel.r][sel.c];
      const capMove = this.getCaptures(sel.r, sel.c).find(m => m.r === r && m.c === c);
      if (capMove) {
        this.board[sel.r][sel.c] = null; this.board[capMove.cr][capMove.cc] = null; this.board[r][c] = piece;
        if (!piece.king && ((piece.color === 'w' && r === 0) || (piece.color === 'b' && r === 7))) piece.king = true;
        this.selected = null; this.render();
        const more = this.getCaptures(r, c);
        if (more.length > 0) { this.captureChain = { r, c }; this.render(); setStatus('Продолжайте взятие'); return; }
        this.captureChain = null; this.mustCapture = false;
        this.endTurn({ from: {r: sel.r, c: sel.c}, to: {r, c}, capture: {r: capMove.cr, c: capMove.cc} });
        return;
      }
      if (!this.mustCapture) {
        const mv = this.getMoves(sel.r, sel.c).find(m => m.r === r && m.c === c);
        if (mv) {
          this.board[sel.r][sel.c] = null; this.board[r][c] = piece;
          if (!piece.king && ((piece.color === 'w' && r === 0) || (piece.color === 'b' && r === 7))) piece.king = true;
          this.selected = null;
          this.endTurn({ from: {r: sel.r, c: sel.c}, to: {r, c} });
          return;
        }
      }
    }
    const p = this.board[r][c];
    if (p && p.color === this.myColor()) {
      if (this.mustCapture && this.getCaptures(r, c).length === 0) { setStatus('Эта шашка не может бить'); return; }
      this.selected = { r, c };
    } else this.selected = null;
    this.render();
  },
  endTurn(moveData) {
    this.render();
    if (!this.checkEnd()) {
      if (gameMode === 'local') { this.turn = this.turn === 'w' ? 'b' : 'w'; this.render(); }
      else if (gameMode === 'p2p') { isMyTurn = false; sendMove(moveData); }
      else { isMyTurn = false; triggerBotIfNeeded(); }
    }
  },
  receive(data) {
    const { from, to, capture } = data;
    const piece = this.board[from.r][from.c];
    this.board[from.r][from.c] = null; if (capture) this.board[capture.r][capture.c] = null; this.board[to.r][to.c] = piece;
    if (!piece.king && ((piece.color === 'w' && to.r === 0) || (piece.color === 'b' && to.r === 7))) piece.king = true;
    isMyTurn = true; this.mustCapture = false; this.captureChain = null; this.render(); this.checkEnd();
  },
  checkEnd() {
    let w = 0, b = 0;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = this.board[r][c]; if (p) p.color === 'w' ? w++ : b++; }
    if ((this.myColor() === 'w' && b === 0) || (this.myColor() === 'b' && w === 0)) { this.done = true; setStatus(gameMode === 'local' ? 'Победа' : 'Вы победили'); if(gameMode !== 'local' && gameMode !== 'p2p') onGameEnd('win', selectedGame, botLevel); return true; }
    if ((this.myColor() === 'w' && w === 0) || (this.myColor() === 'b' && b === 0)) { this.done = true; setStatus(gameMode === 'local' ? 'Победа' : 'Вы проиграли'); if(gameMode !== 'local' && gameMode !== 'p2p') onGameEnd('lose', selectedGame, botLevel); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    const botColor = isHost ? 'b' : 'w'; const caps = this.getAllCaptures(botColor);
    const allMoves = caps.length > 0 ? caps.map(c => ({...c, isCapture: true})) : (() => {
      const m = []; for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = this.board[r][c]; if (p && p.color === botColor) for (const mv of this.getMoves(r, c)) m.push({ from: {r, c}, ...mv, isCapture: false }); } return m;
    })();
    if (allMoves.length === 0) return;
    this.executeBotMove(allMoves[Math.floor(Math.random() * allMoves.length)], botColor);
  },
  executeBotMove(m, color) {
    const piece = this.board[m.from.r][m.from.c];
    this.board[m.from.r][m.from.c] = null; if (m.cr !== undefined) this.board[m.cr][m.cc] = null; this.board[m.r][m.c] = piece;
    if (!piece.king && ((piece.color === 'w' && m.r === 0) || (piece.color === 'b' && m.r === 7))) piece.king = true;
    if (m.isCapture) {
      const further = this.getCaptures(m.r, m.c);
      if (further.length > 0) { this.render(); botDelay(() => { if (!this.done) this.executeBotMove({ from: {r: m.r, c: m.c}, ...further[Math.floor(Math.random() * further.length)], isCapture: true }, color); }); return; }
    }
    this.render(); if (!this.checkEnd()) isMyTurn = true;
  }
};

const Connect4 = {
  board: null, turn: 'R', done: false,
  init() { this.board = Array(6).fill(null).map(() => Array(7).fill('')); this.turn = 'R'; this.done = false; },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="c4-board"></div>';
    const b = document.getElementById('board');
    for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) {
      const cell = document.createElement('div'); cell.className = 'cell';
      if (this.board[r][c] === 'R') cell.classList.add('red');
      if (this.board[r][c] === 'Y') cell.classList.add('yellow');
      cell.onclick = () => this.click(c); b.appendChild(cell);
    }
    if (!this.done) setStatus(gameMode === 'local' ? `Ход: ${this.turn === 'R' ? 'Красные' : 'Жёлтые'}` : (isMyTurn ? 'Ваш ход' : 'Ход противника'));
  },
  click(c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    let sym = gameMode === 'local' ? this.turn : (isHost ? 'R' : 'Y');
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][c]) { r = i; break; }
    if (r === -1) return;
    this.board[r][c] = sym; this.render();
    if (!this.checkWin(r, c)) {
      if (gameMode === 'local') { this.turn = this.turn === 'R' ? 'Y' : 'R'; this.render(); }
      else if (gameMode === 'p2p') { isMyTurn = false; sendMove({ col: c }); }
      else { isMyTurn = false; triggerBotIfNeeded(); }
    }
  },
  receive(data) {
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][data.col]) { r = i; break; }
    if (r === -1) return;
    this.board[r][data.col] = isHost ? 'Y' : 'R'; isMyTurn = true; this.render(); this.checkWin(r, data.col);
  },
  checkWin(r, c) {
    const color = this.board[r][c]; if (!color) return false;
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
      let count = 1;
      for (let s = 1; s < 4; s++) { const nr = r + dr*s, nc = c + dc*s; if (nr<0||nr>=6||nc<0||nc>=7||this.board[nr][nc]!==color) break; count++; }
      for (let s = 1; s < 4; s++) { const nr = r - dr*s, nc = c - dc*s; if (nr<0||nr>=6||nc<0||nc>=7||this.board[nr][nc]!==color) break; count++; }
      if (count >= 4) { this.done = true; 
        if(gameMode === 'local') setStatus(`Победили ${color === 'R' ? 'Красные' : 'Жёлтые'}`);
        else {
          const win = color === (isHost ? 'R' : 'Y');
          setStatus(win ? 'Вы победили' : 'Вы проиграли');
          if(gameMode === 'p2p') room.makeAction('gameover')({ result: win ? 'win' : 'lose' });
          else onGameEnd(win ? 'win' : 'lose', selectedGame, botLevel);
        }
        return true; 
      }
    }
    if (this.board[0].every(v => v)) { this.done = true; setStatus('Ничья'); if(gameMode !== 'local' && gameMode !== 'p2p') onGameEnd('draw', selectedGame, botLevel); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    const botSym = isHost ? 'Y' : 'R';
    let free = []; for (let c = 0; c < 7; c++) if (!this.board[0][c]) free.push(c);
    if (free.length === 0) return;
    let col = free[Math.floor(Math.random() * free.length)];
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][col]) { r = i; break; }
    this.board[r][col] = botSym; this.render(); if (!this.checkWin(r, col)) isMyTurn = true;
  }
};

const Battleship = {
  shipsAtMe: null, shotsAtMe: null, shotsByMe: null, done: false, placing: false, placingIndex: 0, placingDir: 'h', placedShips: [], botQueue: [], shipsBot: null,
  get SIZE() { return bsSize; },
  get shipSizes() { return [4, 3, 3, 2, 2, 2, 1, 1, 1, 1]; },
  init() {
    const S = this.SIZE;
    this.shipsAtMe = Array(S).fill(null).map(() => Array(S).fill(false));
    this.shotsAtMe = Array(S).fill(null).map(() => Array(S).fill(''));
    this.shotsByMe = Array(S).fill(null).map(() => Array(S).fill(''));
    this.done = false; this.placing = true; this.placingIndex = 0; this.placingDir = 'h'; this.placedShips = []; this.botQueue = []; this.shipsBot = null;
    this.render();
  },
  canPlace(r, c, size, horiz, board) {
    const S = this.SIZE;
    for (let i = 0; i < size; i++) {
      const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0);
      if (rr < 0 || rr >= S || cc < 0 || cc >= S || board[rr][cc]) return false;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const nr = rr + dr, nc = cc + dc;
        if (nr >= 0 && nr < S && nc >= 0 && nc < S && board[nr][nc]) return false;
      }
    }
    return true;
  },
  randomPlace() {
    const S = this.SIZE; this.shipsAtMe = Array(S).fill(null).map(() => Array(S).fill(false)); this.placedShips = [];
    for (const size of this.shipSizes) {
      let placed = false, tries = 0;
      while (!placed && tries < 1000) {
        tries++; const horiz = Math.random() < 0.5;
        const r = Math.floor(Math.random() * (horiz ? S : S - size + 1)); const c = Math.floor(Math.random() * (horiz ? S - size + 1 : S));
        if (this.canPlace(r, c, size, horiz, this.shipsAtMe)) {
          for (let i = 0; i < size; i++) { const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0); this.shipsAtMe[rr][cc] = true; }
          this.placedShips.push({ r, c, size, horiz }); placed = true;
        }
      }
    }
  },
  clickPlace(r, c) {
    if (!this.placing) return;
    const size = this.shipSizes[this.placingIndex];
    if (this.canPlace(r, c, size, this.placingDir === 'h', this.shipsAtMe)) {
      for (let i = 0; i < size; i++) { const rr = r + (this.placingDir === 'h' ? 0 : i); const cc = c + (this.placingDir === 'h' ? i : 0); this.shipsAtMe[rr][cc] = true; }
      this.placedShips.push({ r, c, size, horiz: this.placingDir === 'h' }); this.placingIndex++;
      if (this.placingIndex >= this.shipSizes.length) { this.finishPlacement(); return; }
    }
    this.render();
  },
  finishPlacement() {
    this.placing = false;
    if (gameMode === 'p2p') { sendMove({ type: 'placement', ships: this.placedShips }); if (isMyTurn) this.render(); else setStatus('Ожидание расстановки противника'); }
    else { isMyTurn = true; this.render(); }
  },
  render() {
    const S = this.SIZE; const cellSize = S === 8 ? 'min(8vw, 30px)' : 'min(6vw, 25px)';
    if (this.placing) {
      const size = this.shipSizes[this.placingIndex]; const dirText = this.placingDir === 'h' ? 'горизонтально' : 'вертикально';
      gameAreaEl.innerHTML = `
        <div style="text-align:center; width:100%;">
          <div style="margin-bottom:15px; font-family:'Courier New'; font-weight:bold;">Расставьте корабль <b>${size}</b> (${dirText})<br>Осталось: ${this.shipSizes.length - this.placingIndex}</div>
          <div class="btn-row" style="margin-bottom:15px; margin-top:0;">
            <button id="toggleDir" class="btn btn-secondary" style="padding:8px 12px; font-size:11px;">Повернуть</button>
            <button id="randomBtn" class="btn btn-secondary" style="padding:8px 12px; font-size:11px;">Случайно</button>
          </div>
          <div id="place-board" class="bs-board" style="margin:0 auto; width:fit-content; grid-template-columns:repeat(${S},${cellSize}); grid-template-rows:repeat(${S},${cellSize});"></div>
        </div>`;
      document.getElementById('toggleDir').onclick = () => { this.placingDir = this.placingDir === 'h' ? 'v' : 'h'; this.render(); };
      document.getElementById('randomBtn').onclick = () => { this.randomPlace(); this.finishPlacement(); };
      const pb = document.getElementById('place-board');
      for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) {
        const cell = document.createElement('div'); cell.className = 'cell';
        if (this.shipsAtMe[r][c]) cell.classList.add('ship');
        cell.onclick = () => this.clickPlace(r, c); pb.appendChild(cell);
      }
      return;
    }
    gameAreaEl.innerHTML = `<div class="bs-container">
        <div><div class="bs-title">Ваши корабли</div><div id="my-bs" class="bs-board" style="grid-template-columns:repeat(${S},${cellSize});grid-template-rows:repeat(${S},${cellSize})"></div></div>
        <div><div class="bs-title">Поле противника</div><div id="en-bs" class="bs-board" style="grid-template-columns:repeat(${S},${cellSize});grid-template-rows:repeat(${S},${cellSize})"></div></div>
      </div>`;
    const mb = document.getElementById('my-bs'); const eb = document.getElementById('en-bs');
    for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) {
      const mc = document.createElement('div'); mc.className = 'cell';
      if (this.shipsAtMe[r][c]) mc.classList.add('ship');
      const st = this.shotsAtMe[r][c]; if (st === 'hit') mc.classList.add('hit'); else if (st === 'miss') mc.classList.add('miss');
      mb.appendChild(mc);
      const ec = document.createElement('div'); ec.className = 'cell';
      const sb = this.shotsByMe[r][c]; if (sb === 'hit') ec.classList.add('hit'); else if (sb === 'miss') ec.classList.add('miss');
      ec.onclick = () => this.click(r, c); eb.appendChild(ec);
    }
    if (!this.done) setStatus(isMyTurn ? 'Ваш выстрел' : 'Ход противника');
  },
  click(r, c) {
    if (this.placing || this.done || !isMyTurn || this.shotsByMe[r][c]) return;
    if (gameMode === 'p2p') { sendMove({ fire: { r, c } }); isMyTurn = false; setStatus('Ожидание результата'); }
    else { this.playerFire(r, c); if (!this.done) triggerBotIfNeeded(); }
  },
  playerFire(r, c) {
    const hit = this.shipsBot ? this.shipsBot[r][c] : false;
    this.shotsByMe[r][c] = hit ? 'hit' : 'miss';
    let allSunk = true; if (this.shipsBot) { for (let rr = 0; rr < this.SIZE; rr++) for (let cc = 0; cc < this.SIZE; cc++) if (this.shipsBot[rr][cc] && this.shotsByMe[rr][cc] !== 'hit') allSunk = false; }
    if (allSunk && this.shipsBot) { this.done = true; setStatus('Вы победили'); onGameEnd('win', selectedGame, botLevel); } else if (hit) setStatus('Попадание'); else { setStatus('Промах'); isMyTurn = false; }
    this.render();
  },
  receive(data) {
    if (data.type === 'placement') { this.placing = false; this.render(); return; }
    if (data.fire) {
      const { r, c } = data.fire; const hit = this.shipsAtMe[r][c];
      this.shotsAtMe[r][c] = hit ? 'hit' : 'miss';
      let allSunk = true; for (let rr = 0; rr < this.SIZE; rr++) for (let cc = 0; cc < this.SIZE; cc++) if (this.shipsAtMe[rr][cc] && this.shotsAtMe[rr][cc] !== 'hit') allSunk = false;
      sendMove({ result: { r, c, hit, gameOver: allSunk } });
      if (allSunk) { this.done = true; setStatus('Вы проиграли'); } else isMyTurn = !hit;
      this.render();
    } else if (data.result) {
      const { r, c, hit, gameOver } = data.result; this.shotsByMe[r][c] = hit ? 'hit' : 'miss';
      if (gameOver) { this.done = true; setStatus('Вы победили'); } else isMyTurn = hit;
      this.render();
    }
  },
  botMove() {
    if (this.done) return; const S = this.SIZE;
    if (!this.shipsBot) {
      this.shipsBot = Array(S).fill(null).map(() => Array(S).fill(false));
      for (const size of this.shipSizes) {
        let placed = false, tries = 0;
        while (!placed && tries < 1000) {
          tries++; const horiz = Math.random() < 0.5;
          const r = Math.floor(Math.random() * (horiz ? S : S - size + 1)); const c = Math.floor(Math.random() * (horiz ? S - size + 1 : S));
          if (this.canPlace(r, c, size, horiz, this.shipsBot)) { for (let i = 0; i < size; i++) { const rr = r + (horiz ? 0 : i), cc = c + (horiz ? i : 0); this.shipsBot[rr][cc] = true; } placed = true; }
        }
      }
    }
    let target = null;
    if (botLevel !== 'easy') { while (this.botQueue.length > 0 && !target) { const t = this.botQueue.shift(); if (!this.shotsAtMe[t.r][t.c]) target = t; } }
    if (!target) {
      const avail = []; for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) { if (this.shotsAtMe[r][c]) continue; if (botLevel === 'hard' && (r + c) % 2 !== 0) continue; avail.push({ r, c }); }
      if (avail.length === 0) { for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) if (!this.shotsAtMe[r][c]) avail.push({ r, c }); }
      target = avail[Math.floor(Math.random() * avail.length)];
    }
    if (!target) return; const { r, c } = target; const hit = this.shipsAtMe[r][c];
    this.shotsAtMe[r][c] = hit ? 'hit' : 'miss';
    if (hit && botLevel !== 'easy') { for (const [dr, dc] of [[0,1],[1,0],[0,-1],[-1,0]]) { const nr = r + dr, nc = c + dc; if (nr >= 0 && nr < S && nc >= 0 && nc < S && !this.shotsAtMe[nr][nc]) this.botQueue.push({ r: nr, c: nc }); } }
    let allSunk = true; for (let rr = 0; rr < S; rr++) for (let cc = 0; cc < S; cc++) if (this.shipsAtMe[rr][cc] && this.shotsAtMe[rr][cc] !== 'hit') allSunk = false;
    this.render();
    if (allSunk) { this.done = true; setStatus('Вы проиграли'); onGameEnd('lose', selectedGame, botLevel); return; }
    if (hit) { setStatus('Бот попал'); botDelay(() => { if (!this.done) this.botMove(); }); } else { setStatus('Бот промахнулся. Ваш ход'); isMyTurn = true; }
  }
};
