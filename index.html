<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Игры для компании</title>
<meta name="theme-color" content="#ece2cd">
<style>
:root {
  --paper: #ece2cd; --paper-d: #ddd0b2; --ink: #26201a; --ink-soft: #5a4a38;
  --seal: #8b2019; --gold: #9c7a2c; --frame: #3a2c1c; --card: rgba(58,44,28,.05);
  --shadow: rgba(58,44,28,.2); --overlay-bg: rgba(30,22,14,.72);
}
body.dark {
  --paper: #1a1714; --paper-d: #24201a; --ink: #e8dfd0; --ink-soft: #a89880;
  --seal: #d4513f; --gold: #d4a94c; --frame: #4a3a28; --card: rgba(232,223,208,.05);
  --shadow: rgba(0,0,0,.5); --overlay-bg: rgba(0,0,0,.85);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%; font-family: Georgia, serif;
  background: var(--paper); color: var(--ink);
  transition: background .3s, color .3s; overflow-x: hidden; user-select: none;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 50% 40% at 20% 15%, rgba(180,140,80,.15), transparent 70%),
              radial-gradient(ellipse 55% 45% at 80% 85%, rgba(140,100,50,.12), transparent 70%);
}
body.dark::before { opacity: .15; }
.frame { position: fixed; inset: 12px; border: 1px solid var(--frame); opacity: .4; pointer-events: none; z-index: 5; }

.container { max-width: 900px; margin: 0 auto; padding: 20px 10px; position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
h1 { font-size: clamp(20px, 5vw, 32px); margin-bottom: 15px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }

#top-bar { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; width: 100%; flex-wrap: wrap; position: relative; z-index: 100; }
#top-bar button { padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; background: var(--card); color: var(--ink); border: 1px solid var(--frame); cursor: pointer; text-transform: uppercase; }
#top-bar button.btn-seal { background: var(--seal); color: var(--paper); border-color: var(--seal); }

#menu { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; width: 100%; }
#menu button { padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; background: var(--card); color: var(--ink); border: 1px solid var(--frame); cursor: pointer; text-transform: uppercase; flex: 1; min-width: 90px; }
#menu button.active { background: var(--seal); color: var(--paper); border-color: var(--seal); }
#menu button:disabled { opacity: 0.5; cursor: not-allowed; }

.panel { background: var(--paper); border: 1px solid var(--frame); box-shadow: 4px 4px 0 var(--shadow); padding: 15px; width: 100%; max-width: 700px; margin-bottom: 15px; position: relative; }

#settings { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 15px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 8px; border: 1px solid var(--frame); background: var(--card); }
.setting-row label { font-size: 13px; font-weight: bold; }
.setting-row select { padding: 6px; font-family: 'Courier New', monospace; font-size: 12px; background: var(--paper); border: 1px solid var(--frame); color: var(--ink); }

.btn { padding: 10px 20px; font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; color: var(--paper); background: var(--ink); border: 1px solid var(--frame); cursor: pointer; text-transform: uppercase; box-shadow: 3px 3px 0 var(--shadow); }
.btn-seal { background: var(--seal); }
.btn-secondary { background: var(--paper); color: var(--ink); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }

#status { font-size: 14px; font-weight: bold; text-align: center; min-height: 20px; margin-bottom: 15px; font-family: 'Courier New', monospace; color: var(--seal); text-transform: uppercase; }
#game-area { display: flex; justify-content: center; width: 100%; margin-bottom: 15px; min-height: 50px; position: relative; }
.hidden { display: none !important; }

/* P2P Box */
.p2p-box { width: 100%; display: flex; flex-direction: column; gap: 8px; background: var(--card); padding: 12px; border: 1px dashed var(--frame); margin-top: 10px; }
.p2p-box input { width: 100%; padding: 8px; font-family: monospace; font-size: 11px; border: 1px solid var(--frame); background: var(--paper); color: var(--ink); }
.p2p-box button { padding: 8px; background: var(--ink); color: var(--paper); border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }

/* Игровые доски */
.ttt-board { display: grid; grid-template-columns: repeat(3, 1fr); width: min(280px, 80vw); aspect-ratio: 1; gap: 4px; background: var(--frame); border: 4px solid var(--frame); }
.ttt-board .cell { background: var(--paper); display: flex; justify-content: center; align-items: center; font-size: min(15vw, 50px); font-weight: bold; cursor: pointer; }
.ttt-board .cell.win { background: var(--gold); color: var(--paper); }

.chess-board, .checkers-board { display: grid; grid-template-columns: repeat(8, 1fr); width: min(350px, 90vw); aspect-ratio: 1; border: 4px solid var(--frame); background: var(--frame); gap: 1px; }
.chess-board .cell, .checkers-board .cell { display: flex; justify-content: center; align-items: center; font-size: min(8vw, 28px); cursor: pointer; }
.light { background: var(--paper); } .dark { background: var(--paper-d); }
.checker-w { width: 70%; height: 70%; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
.checker-b { width: 70%; height: 70%; border-radius: 50%; background: var(--ink); border: 2px solid var(--ink); }

.c4-board { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); width: min(350px, 90vw); aspect-ratio: 7/6; background: var(--frame); border: 4px solid var(--frame); gap: 4px; padding: 4px; }
.c4-board .cell { background: var(--paper); border-radius: 50%; cursor: pointer; }
.c4-board .cell.red { background: var(--seal); }
.c4-board .cell.yellow { background: var(--gold); }

/* Мини-игры для компании */
.tug-container { display: flex; width: 100%; height: 300px; border: 4px solid var(--frame); position: relative; overflow: hidden; }
.tug-half { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; }
.tug-p1 { background: rgba(139,32,25,0.2); color: var(--seal); border-right: 2px dashed var(--frame); }
.tug-p2 { background: rgba(156,122,44,0.2); color: var(--gold); }
.tug-rope { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: var(--ink); border-radius: 50%; transform: translate(-50%, -50%); transition: left 0.1s; z-index: 10; pointer-events: none; }

.reaction-container { width: 100%; height: 300px; display: flex; border: 4px solid var(--frame); }
.reaction-half { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: white; cursor: pointer; }
.reaction-p1 { background: #e74c3c; border-right: 2px solid white; }
.reaction-p2 { background: #3498db; }

.modal { position: fixed; inset: 0; background: var(--overlay-bg); z-index: 2000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px; }
.modal.open { opacity: 1; pointer-events: auto; }
.modal-content { background: var(--paper); border: 1px solid var(--frame); box-shadow: 6px 6px 0 var(--shadow); width: 100%; max-width: 400px; display: flex; flex-direction: column; }
.modal-header { padding: 15px; border-bottom: 1px solid var(--frame); font-weight: bold; text-transform: uppercase; display: flex; justify-content: space-between; }
.modal-body { padding: 20px; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink); }

@media (max-width: 600px) {
  .setting-row { flex-direction: column; align-items: flex-start; gap: 5px; }
  .setting-row select { width: 100%; }
  .btn { width: 100%; }
}
</style>
</head>
<body>

<div class="frame"></div>

<div class="container">
  <h1>Игры для компании</h1>
  
  <div id="top-bar">
    <button id="btn-settings" class="btn-seal">Настройки</button>
    <button id="btn-other">Другие игры</button>
    <button id="theme-toggle">Тема</button>
  </div>

  <div id="menu">
    <button data-game="tictactoe" class="active">Крестики-нолики</button>
    <button data-game="tug">Канат</button>
    <button data-game="reaction">Реакция</button>
    <button data-game="connect4">4 в ряд</button>
    <button data-game="chess">Шахматы</button>
    <button data-game="checkers">Шашки</button>
  </div>

  <div class="panel">
    <div id="settings">
      <div class="setting-row">
        <label>Режим игры</label>
        <select id="mode">
          <option value="local">На 1 устройстве</option>
          <option value="bot">С ботом</option>
          <option value="p2p">🌐 Онлайн P2P (Wi-Fi/Сеть)</option>
        </select>
      </div>
      <div class="setting-row" id="levelRow">
        <label>Сложность бота</label>
        <select id="level">
          <option value="easy">Лёгкий</option>
          <option value="medium">Средний</option>
          <option value="hard">Сложный</option>
        </select>
      </div>
    </div>

    <div id="status">Выберите игру</div>
    <div id="game-area"></div>

    <div class="btn-row">
      <button id="startBtn" class="btn btn-seal">Начать игру</button>
      <button id="backBtn" class="btn btn-secondary hidden">В меню</button>
      <button id="downloadBtn" class="btn btn-secondary" style="color: var(--gold); border-color: var(--gold);">Скачать</button>
    </div>

    <!-- Блок P2P (Коды подключения) -->
    <div id="p2pUI" class="hidden p2p-box">
      <div id="hostUI">
        <p style="font-size:11px; color:var(--ink-soft); margin-bottom:5px;">1. Создайте код и отправьте другу.</p>
        <button id="genCodeBtn" class="btn-seal" style="width:100%;">Создать код</button>
        <input type="text" id="hostCodeOut" readonly placeholder="Здесь появится ваш код...">
        <p style="font-size:11px; color:var(--ink-soft); margin:10px 0 5px;">2. Вставьте ответный код друга:</p>
        <input type="text" id="guestCodeIn" placeholder="Ответный код друга">
        <button id="finishConnBtn" style="width:100%; margin-top:5px;">Подключиться</button>
      </div>
      <div id="guestUI" class="hidden">
        <p style="font-size:11px; color:var(--ink-soft); margin-bottom:5px;">1. Вставьте код приглашения:</p>
        <input type="text" id="hostCodeIn" placeholder="Код приглашения">
        <button id="joinGameBtn" class="btn-seal" style="width:100%; margin-top:5px;">Создать ответ</button>
        <p style="font-size:11px; color:var(--ink-soft); margin:10px 0 5px;">2. Отправьте этот ответ другу:</p>
        <input type="text" id="guestCodeOut" readonly placeholder="Здесь появится ответный код...">
      </div>
    </div>
  </div>
</div>

<!-- Модалки -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header"><span>Настройки</span><button class="modal-close" onclick="document.getElementById('settingsModal').classList.remove('open')">×</button></div>
    <div class="modal-body">
      <div class="setting-row" style="margin-bottom: 10px;"><label>Звуки</label><button class="btn btn-secondary" style="padding: 5px;" onclick="alert('Звуки включены')">Вкл</button></div>
      <div class="setting-row" style="margin-bottom: 10px;"><label>Вибрация</label><button class="btn btn-secondary" style="padding: 5px;" onclick="alert('Вибрация включена')">Вкл</button></div>
    </div>
  </div>
</div>

<div class="modal" id="otherModal">
  <div class="modal-content">
    <div class="modal-header"><span>Другие игры</span><button class="modal-close" onclick="document.getElementById('otherModal').classList.remove('open')">×</button></div>
    <div class="modal-body" style="text-align:center;">
      <a href="https://gffrgoogle.github.io/haha/" target="_blank" class="btn btn-seal" style="text-decoration: none; display: inline-block;">Играть в ХА-ХА-ХА</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
// ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
let p2p = null, isHost = false, isMyTurn = false;
let selectedGame = 'tictactoe';
let currentGame = null;
let gameMode = 'local';
let botLevel = 'easy';

const statusEl = document.getElementById('status');
const gameAreaEl = document.getElementById('game-area');
const startBtn = document.getElementById('startBtn');
const backBtn = document.getElementById('backBtn');
const modeSel = document.getElementById('mode');
const levelSel = document.getElementById('level');
const levelRow = document.getElementById('levelRow');
const p2pUI = document.getElementById('p2pUI');
const hostUI = document.getElementById('hostUI');
const guestUI = document.getElementById('guestUI');

function setStatus(t) { statusEl.textContent = t; }
function sendMove(data) { if (p2p) p2p.send({ ...data, _g: selectedGame }); }
function botDelay(fn) { setTimeout(fn, 500); }

// ========== UI ЛОГИКА ==========
document.getElementById('btn-settings').onclick = () => document.getElementById('settingsModal').classList.add('open');
document.getElementById('btn-other').onclick = () => document.getElementById('otherModal').classList.add('open');
document.getElementById('theme-toggle').onclick = () => {
  document.body.classList.toggle('dark');
  document.getElementById('theme-toggle').textContent = document.body.classList.contains('dark') ? 'Светлая' : 'Тёмная';
};
document.getElementById('downloadBtn').onclick = () => {
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type: 'text/html'})); a.download = 'company_games.html'; a.click();
  alert('Игра скачана!');
};

document.querySelectorAll('#menu button').forEach(btn => {
  btn.onclick = () => {
    if (p2p) return;
    document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedGame = btn.dataset.game;
    gameAreaEl.innerHTML = '';
    setStatus(`Выбрано: ${btn.textContent}`);
    updateSettings();
  };
});

modeSel.onchange = () => { gameMode = modeSel.value; updateSettings(); };
levelSel.onchange = () => { botLevel = levelSel.value; };

function updateSettings() {
  const isP2P = modeSel.value === 'p2p';
  levelRow.classList.toggle('hidden', isP2P || gameMode === 'local' || ['tug', 'reaction'].includes(selectedGame));
  p2pUI.classList.toggle('hidden', !isP2P);
  startBtn.classList.toggle('hidden', isP2P);
}

// ========== СТАРТ И СБРОС ==========
startBtn.onclick = () => {
  gameMode = modeSel.value;
  botLevel = levelSel.value;
  isHost = true;
  startGame(selectedGame);
};

backBtn.onclick = () => {
  if (p2p) { p2p.close(); p2p = null; }
  currentGame = null;
  gameAreaEl.innerHTML = '';
  startBtn.classList.remove('hidden');
  backBtn.classList.add('hidden');
  modeSel.disabled = false;
  document.querySelectorAll('#menu button').forEach(b => b.disabled = false);
  document.getElementById('hostCodeOut').value = '';
  document.getElementById('guestCodeIn').value = '';
  document.getElementById('hostCodeIn').value = '';
  document.getElementById('guestCodeOut').value = '';
  document.getElementById('genCodeBtn').disabled = false;
  document.getElementById('joinGameBtn').disabled = false;
  p2pUI.classList.add('hidden');
  setStatus(`Выбрано: ${document.querySelector('#menu button.active').textContent}`);
  updateSettings();
};

function startGame(gameName) {
  isMyTurn = true;
  const Games = { 
    tictactoe: TicTacToe, tug: TugOfWar, reaction: ReactionTest,
    connect4: Connect4, chess: ChessG, checkers: Checkers 
  };
  currentGame = Games[gameName];
  currentGame.init();
  currentGame.render();
  startBtn.classList.add('hidden');
  backBtn.classList.remove('hidden');
  modeSel.disabled = true;
  document.querySelectorAll('#menu button').forEach(b => b.disabled = true);
  p2pUI.classList.add('hidden');
}

function triggerBotIfNeeded() {
  if (gameMode !== 'bot' || !currentGame || currentGame.done) return;
  botDelay(() => { if (!currentGame.done) currentGame.botMove(); });
}

// ========== P2P РУЧНОЙ WEBRTC ==========
class ManualP2P {
  constructor() { this.pc = null; this.channel = null; this.onData = null; this.onOpen = null; }
  async createOffer() {
    this.pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    this.channel = this.pc.createDataChannel('game');
    this.setupChannel();
    const candidates = [];
    this.pc.onicecandidate = e => { if (e.candidate) candidates.push(e.candidate); };
    await this.pc.setLocalDescription(await this.pc.createOffer());
    return new Promise(resolve => {
      const check = () => {
        if (this.pc.iceGatheringState === 'complete') {
          resolve(btoa(unescape(encodeURIComponent(JSON.stringify({ sdp: this.pc.localDescription.sdp, candidates })))));
        }
      };
      this.pc.onicegatheringstatechange = check;
      setTimeout(check, 2000);
    });
  }
  async acceptOffer(code) {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    this.pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    this.pc.ondatachannel = e => { this.channel = e.channel; this.setupChannel(); };
    await this.pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: data.sdp }));
    for (const c of data.candidates) await this.pc.addIceCandidate(new RTCIceCandidate(c));
    const candidates = [];
    this.pc.onicecandidate = e => { if (e.candidate) candidates.push(e.candidate); };
    await this.pc.setLocalDescription(await this.pc.createAnswer());
    return new Promise(resolve => {
      const check = () => {
        if (this.pc.iceGatheringState === 'complete') {
          resolve(btoa(unescape(encodeURIComponent(JSON.stringify({ sdp: this.pc.localDescription.sdp, candidates })))));
        }
      };
      this.pc.onicegatheringstatechange = check;
      setTimeout(check, 2000);
    });
  }
  async acceptAnswer(code) {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    await this.pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: data.sdp }));
    for (const c of data.candidates) await this.pc.addIceCandidate(new RTCIceCandidate(c));
  }
  setupChannel() { this.channel.onopen = () => { if (this.onOpen) this.onOpen(); }; this.channel.onmessage = e => { if (this.onData) this.onData(JSON.parse(e.data)); }; }
  send(data) { if (this.channel && this.channel.readyState === 'open') this.channel.send(JSON.stringify(data)); }
  close() { if (this.channel) this.channel.close(); if (this.pc) this.pc.close(); }
}

document.getElementById('genCodeBtn').onclick = async () => {
  if (p2p) return;
  p2p = new ManualP2P();
  setStatus('Генерация кода...');
  document.getElementById('genCodeBtn').disabled = true;
  const code = await p2p.createOffer();
  document.getElementById('hostCodeOut').value = code;
  setStatus('Код готов! Отправьте его другу.');
  isHost = true;
};

document.getElementById('finishConnBtn').onclick = async () => {
  const answer = document.getElementById('guestCodeIn').value.trim();
  if (!answer) return alert('Вставьте ответный код!');
  setStatus('Установка соединения...');
  try {
    await p2p.acceptAnswer(answer);
    setupGameConnection();
  } catch(e) { setStatus('Ошибка подключения.'); }
};

document.getElementById('joinGameBtn').onclick = async () => {
  const offer = document.getElementById('hostCodeIn').value.trim();
  if (!offer) return alert('Вставьте код приглашения!');
  if (p2p) return;
  p2p = new ManualP2P();
  setStatus('Генерация ответа...');
  document.getElementById('joinGameBtn').disabled = true;
  try {
    const answer = await p2p.acceptOffer(offer);
    document.getElementById('guestCodeOut').value = answer;
    setStatus('Ответ готов! Отправьте его хосту.');
    isHost = false;
    setupGameConnection();
  } catch(e) { setStatus('Ошибка. Неверный код.'); }
};

function setupGameConnection() {
  p2p.onData = data => {
    if (data.type === 'start') {
      isHost = false;
      startGame(data.game);
    } else if (currentGame && currentGame.receive) {
      currentGame.receive(data);
    }
  };
  p2p.onOpen = () => {
    setStatus('Соединение установлено!');
    if (isHost) {
      p2p.send({ type: 'start', game: selectedGame });
      startGame(selectedGame);
    }
  };
}

// ==========================================
// ИГРЫ
// ==========================================

// 1. КРЕСТИКИ-НОЛИКИ
const TicTacToe = {
  board: null, done: false, turn: 'X',
  init() { this.board = Array(9).fill(''); this.done = false; this.turn = 'X'; },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="ttt-board"></div>';
    document.getElementById('board').innerHTML = this.board.map((v, i) => 
      `<div class="cell" onclick="TicTacToe.click(${i})" style="color:${v==='X'?'var(--ink)':'var(--seal)'}">${v}</div>`
    ).join('');
    if (!this.done) setStatus(gameMode === 'local' ? `Ход: ${this.turn}` : (isMyTurn ? 'Ваш ход' : 'Ход противника'));
  },
  click(i) {
    if (this.done || this.board[i] || (gameMode !== 'local' && !isMyTurn)) return;
    let sym = gameMode === 'local' ? this.turn : (isHost ? 'X' : 'O');
    this.board[i] = sym; this.render();
    if (!this.checkWin()) {
      if (gameMode === 'local') { this.turn = this.turn === 'X' ? 'O' : 'X'; this.render(); }
      else if (gameMode === 'p2p') { isMyTurn = false; sendMove({ index: i }); this.render(); }
      else { isMyTurn = false; triggerBotIfNeeded(); }
    }
  },
  receive(data) { this.board[data.index] = isHost ? 'O' : 'X'; isMyTurn = true; this.render(); this.checkWin(); },
  checkWin() {
    const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const [a,b,c] of w) {
      if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) {
        this.done = true; setStatus(`🎉 Победили ${this.board[a]}`); return true;
      }
    }
    if (!this.board.includes('')) { this.done = true; setStatus('Ничья'); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    const free = this.board.map((v, i) => v ? null : i).filter(v => v !== null);
    this.board[free[Math.floor(Math.random() * free.length)]] = 'O';
    isMyTurn = true; this.render(); this.checkWin();
  }
};

// 2. ПЕРЕТЯГИВАНИЕ КАНАТА
const TugOfWar = {
  pos: 50, done: false,
  init() { this.pos = 50; this.done = false; },
  render() {
    gameAreaEl.innerHTML = `
      <div class="tug-container">
        <div class="tug-half tug-p1" onclick="TugOfWar.tap(1)">ИГРОК 1</div>
        <div class="tug-half tug-p2" onclick="TugOfWar.tap(2)">ИГРОК 2</div>
        <div class="tug-rope" id="tug-rope" style="left: ${this.pos}%"></div>
      </div>`;
    setStatus(gameMode === 'p2p' ? 'Жмите на свою половину!' : 'Жмите на свою половину!');
  },
  tap(player) {
    if (this.done) return;
    let move = (player === 1) ? -2 : 2;
    this.pos += move;
    if (document.getElementById('tug-rope')) document.getElementById('tug-rope').style.left = this.pos + '%';
    
    if (gameMode === 'p2p') {
      // В P2P игрок 1 это Хост, Игрок 2 это Гость
      if ((isHost && player === 1) || (!isHost && player === 2)) {
        sendMove({ type: 'tap', val: move });
      }
    }
    this.checkWin();
  },
  receive(data) {
    if (data.type === 'tap') {
      this.pos += data.val;
      if (document.getElementById('tug-rope')) document.getElementById('tug-rope').style.left = this.pos + '%';
      this.checkWin();
    }
  },
  checkWin() {
    if (this.pos <= 10) { this.done = true; setStatus('🎉 Победил Игрок 1!'); }
    if (this.pos >= 90) { this.done = true; setStatus('🎉 Победил Игрок 2!'); }
  }
};

// 3. РЕАКЦИЯ
const ReactionTest = {
  done: false, canClick: false, timer: null, startTime: 0,
  init() { this.done = false; this.canClick = false; },
  render() {
    gameAreaEl.innerHTML = `
      <div class="reaction-container">
        <div class="reaction-half reaction-p1" id="rx-p1" onclick="ReactionTest.click(1)">ЖДИТЕ...</div>
        <div class="reaction-half reaction-p2" id="rx-p2" onclick="ReactionTest.click(2)">ЖДИТЕ...</div>
      </div>`;
    setStatus('Приготовьтесь...');
    
    const delay = Math.random() * 3000 + 2000;
    this.timer = setTimeout(() => {
      this.canClick = true;
      this.startTime = Date.now();
      const p1 = document.getElementById('rx-p1');
      const p2 = document.getElementById('rx-p2');
      if(p1 && p2) {
        p1.style.background = '#2ecc71'; p2.style.background = '#2ecc71';
        p1.textContent = 'ЖМИ!'; p2.textContent = 'ЖМИ!';
      }
      setStatus('ЖМИ!');
    }, delay);
  },
  click(player) {
    if (this.done) return;
    if (!this.canClick) {
      clearTimeout(this.timer);
      this.done = true;
      setStatus(`Игрок ${player} поторопился и проиграл!`);
      return;
    }
    this.done = true;
    setStatus(`🎉 Игрок ${player} победил!`);
    gameAreaEl.innerHTML = `<div style="text-align:center; padding: 20px;"><h2 style="color: var(--seal);">Быстрее всех Игрок ${player}!</h2></div>`;
    
    if (gameMode === 'p2p' && ((isHost && player === 1) || (!isHost && player === 2))) {
      sendMove({ type: 'rx_win', player });
    }
  },
  receive(data) {
    if (data.type === 'rx_win') { this.done = true; setStatus(`🎉 Игрок ${data.player} победил (по сети)!`); }
  }
};

// 4. 4 В РЯД
const Connect4 = {
  board: null, turn: 'R', done: false,
  init() { this.board = Array(6).fill(null).map(() => Array(7).fill('')); this.turn = 'R'; this.done = false; },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="c4-board"></div>';
    document.getElementById('board').innerHTML = this.board.map((row, r) => 
      row.map((v, c) => `<div class="cell ${v==='R'?'red':v==='Y'?'yellow':''}" onclick="Connect4.click(${c})"></div>`).join('')
    ).join('');
    if (!this.done) setStatus(gameMode === 'local' ? `Ход: ${this.turn}` : (isMyTurn ? 'Ваш ход' : 'Ход противника'));
  },
  click(c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    let sym = gameMode === 'local' ? this.turn : (isHost ? 'R' : 'Y');
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][c]) { r = i; break; }
    if (r === -1) return;
    this.board[r][c] = sym; this.render();
    if (!this.checkWin(r, c)) {
      if (gameMode === 'local') { this.turn = this.turn === 'R' ? 'Y' : 'R'; this.render(); }
      else if (gameMode === 'p2p') { isMyTurn = false; sendMove({ col: c }); }
      else { isMyTurn = false; triggerBotIfNeeded(); }
    }
  },
  receive(data) {
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][data.col]) { r = i; break; }
    this.board[r][data.col] = isHost ? 'Y' : 'R'; isMyTurn = true; this.render(); this.checkWin(r, data.col);
  },
  checkWin(r, c) {
    const color = this.board[r][c]; if (!color) return false;
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (const [dr, dc] of dirs) {
      let count = 1;
      for (let s = 1; s < 4; s++) { const nr = r + dr*s, nc = c + dc*s; if (nr<0||nr>=6||nc<0||nc>=7||this.board[nr][nc]!==color) break; count++; }
      for (let s = 1; s < 4; s++) { const nr = r - dr*s, nc = c - dc*s; if (nr<0||nr>=6||nc<0||nc>=7||this.board[nr][nc]!==color) break; count++; }
      if (count >= 4) { this.done = true; setStatus(`🎉 Победили ${color === 'R' ? 'Красные' : 'Жёлтые'}`); return true; }
    }
    if (this.board[0].every(v => v)) { this.done = true; setStatus('Ничья'); return true; }
    return false;
  },
  botMove() {
    if (this.done) return;
    let free = []; for (let c = 0; c < 7; c++) if (!this.board[0][c]) free.push(c);
    let col = free[Math.floor(Math.random() * free.length)];
    let r = -1; for (let i = 5; i >= 0; i--) if (!this.board[i][col]) { r = i; break; }
    this.board[r][col] = 'Y'; isMyTurn = true; this.render(); this.checkWin(r, col);
  }
};

// 5. ШАХМАТЫ (Упрощенные для скрипта)
const ChessG = {
  game: null, selected: null, done: false,
  init() { this.game = new Chess(); this.selected = null; this.done = false; },
  myColor() { return gameMode === 'local' ? this.game.turn() : (isHost ? 'w' : 'b'); },
  render() {
    gameAreaEl.innerHTML = '<div id="board" class="chess-board"></div>';
    const board = this.game.board();
    const sym = {p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚',P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔'};
    const flip = this.myColor() === 'b';
    let html = '';
    for (let rr = 0; rr < 8; rr++) for (let cc = 0; cc < 8; cc++) {
      const r = flip ? 7 - rr : rr, c = flip ? 7 - cc : cc; const p = board[r][c];
      html += `<div class="cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}" onclick="ChessG.click(${r},${c})" style="color:${p&&p.color==='w'?'#fff':'#111'}">
        ${p ? sym[p.color === 'w' ? p.type.toUpperCase() : p.type] : ''}
      </div>`;
    }
    document.getElementById('board').innerHTML = html;
    if (!this.done) setStatus(gameMode === 'local' ? (this.game.turn() === 'w' ? 'Ход белых' : 'Ход чёрных') : (isMyTurn ? 'Ваш ход' : 'Ход противника'));
  },
  click(r, c) {
    if (this.done || (gameMode !== 'local' && !isMyTurn)) return;
    if (this.selected) {
      const from = String.fromCharCode(97 + this.selected.c) + (8 - this.selected.r);
      const to = String.fromCharCode(97 + c) + (8 - r);
      try {
        if (this.game.move({ from, to, promotion: 'q' })) {
          this.selected = null; this.render();
          if (!this.checkEnd()) {
            if (gameMode === 'p2p') { isMyTurn = false; sendMove({ from, to }); }
            else if (gameMode === 'bot') { isMyTurn = false; triggerBotIfNeeded(); }
          }
          return;
        }
      } catch(e) {}
    }
    const piece = this.game.get(String.fromCharCode(97 + c) + (8 - r));
    this.selected = (piece && piece.color === this.myColor()) ? { r, c } : null; this.render();
  },
  receive(data) { try { this.game.move(data); } catch(e) {} isMyTurn = true; this.render(); this.checkEnd(); },
  checkEnd() {
    if (this.game.in_checkmate()) { this.done = true; setStatus('Мат!'); return true; }
    if (this.game.in_draw()) { this.done = true; setStatus('Ничья'); return true; }
    return false;
  },
  botMove() {
    const moves = this.game.moves(); if (!moves.length) return;
    this.game.move(moves[Math.floor(Math.random() * moves.length)]);
    isMyTurn = true; this.render(); this.checkEnd();
  }
};
